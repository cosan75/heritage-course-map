<script>
/* 카카오톡·스레드·인스타그램 같은 앱 안 브라우저로 열리면 화면이 좁다 → 휴대폰 기본 브라우저로 내보낸다 */
(function(){
  var ua=navigator.userAgent||"", u=location.href;
  if(/KAKAOTALK/i.test(ua)){location.href="kakaotalk://web/openExternal?url="+encodeURIComponent(u);return;}
  if(!/Instagram|Barcelona|Threads|FBAN|FBAV|FB_IAB|Line\/|NAVER\(inapp|DaumApps|BAND\/|everytimeApp/i.test(ua)) return;
  if(/Android/i.test(ua)){  // 안드로이드: 크롬으로 (크롬이 없으면 그대로)
    location.href="intent://"+u.replace(/^https?:\/\//,"")+"#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url="+encodeURIComponent(u)+";end";return;}
  // 아이폰: 앱이 밖으로 못 내보내므로 위에 안내 띠
  document.addEventListener("DOMContentLoaded",function(){
    var d=document.createElement("div"); d.className="inapp";
    d.innerHTML='<span>앱 안 브라우저라 화면이 좁아요.</span><a href="x-safari-'+u.replace(/"/g,"%22")+'">Safari로 열기</a><button type="button" data-copy>주소 복사</button><button type="button" data-x aria-label="닫기">✕</button>';
    d.querySelector("[data-copy]").onclick=function(e){try{navigator.clipboard.writeText(u);e.target.textContent="복사됨";}catch(_){prompt("주소를 복사하세요",u);}};
    d.querySelector("[data-x]").onclick=function(){d.remove();};
    document.body.appendChild(d);
  });
})();
</script>

<style>
/* 카카오맵처럼: 지도가 화면 전부. 위에 검색창, 아래에 아이콘 줄, 필요할 때만 아래에서 올라오는 창(반·크게).
   색: 종이·먹·바다선 파랑. 인주색(--seal)은 '도장 받은 곳'에만 쓴다. */
:root{
  --paper:#f4f3ee; --sheet:#ffffff; --ink:#1f2328; --muted:#5f655f; --rule:#e2e0d8;
  --sea:#2c5d82; --sea-soft:#e2ebf1; --seal:#c8372d; --seal-soft:#fbe9e7; --food:#d9661c; --me:#1f6fd6;
  --ok:#1e7a46; --ok-soft:#dcefe3; --warn:#94590a; --warn-soft:#f8ead2; --kh:#6b5b95; --star:#f2a516;
  --display:"Gowun Batang","Noto Serif KR",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --shadow:0 2px 10px rgb(0 0 0 / .16);
  --navh:76px; --pv:0px; --topb:64px; --navbg:#f1f2f4;  /* --navh: 아이콘 줄 58 + 아래·위 틈 */
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#15181b; --sheet:#1d2125; --ink:#e9e8e2; --muted:#a2a79f; --rule:#343a3f;
  --sea:#7fb0d6; --sea-soft:#1e2c37; --seal:#ef6a5c; --seal-soft:#3a1f1c; --food:#f08f4e; --me:#66a6ff;
  --ok:#82d3a2; --ok-soft:#1b3326; --warn:#f0bf6c; --warn-soft:#382c16; --kh:#b3a6dc; --star:#f5b83d; --navbg:#2a2f34; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#15181b; --sheet:#1d2125; --ink:#e9e8e2; --muted:#a2a79f; --rule:#343a3f;
  --sea:#7fb0d6; --sea-soft:#1e2c37; --seal:#ef6a5c; --seal-soft:#3a1f1c; --food:#f08f4e; --me:#66a6ff;
  --ok:#82d3a2; --ok-soft:#1b3326; --warn:#f0bf6c; --warn-soft:#382c16; --kh:#b3a6dc; --star:#f5b83d; --navbg:#2a2f34; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--paper);color:var(--ink);font:14px/1.5 var(--body);word-break:keep-all;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent}
a{color:var(--sea)}
button{font:inherit;color:inherit}
#map{position:fixed;inset:0;background:var(--sea-soft)}
.leaflet-container img.leaflet-tile{mix-blend-mode:plus-lighter}  /* 확대 배율이 100%가 아닐 때 타일 사이 흰 줄 없애기 */
.leaflet-container{font:inherit}
.leaflet-bottom{bottom:calc(var(--navh) + var(--pv));transition:bottom .28s cubic-bezier(.2,.8,.2,1)}
.leaflet-control-attribution{font-size:10px}
.leaflet-popup-content{font:13px/1.55 var(--body);word-break:keep-all;margin:12px 14px}
.leaflet-popup-content b{font-size:14px}
.leaflet-popup-content .pp-img{width:180px;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;margin-top:6px;display:block;background:var(--rule)}
.leaflet-top.leaflet-right{top:var(--topb)}

/* 위: 검색창 */
.top{position:fixed;z-index:1100;left:12px;right:12px;top:max(10px,env(safe-area-inset-top,0px))}
.sbox{display:flex;align-items:center;gap:6px;height:48px;background:var(--sheet);border-radius:23px;box-shadow:var(--shadow);padding:0 6px 0 16px}
.sbox svg{flex:none;color:var(--muted)}
/* 제목: 기와지붕 모자 도장 캐릭터 + 국가유산(작게) / 도장깨기(인주색) — 검색창 왼쪽에 붙여 지도를 가리지 않게 */
.brand{display:flex;align-items:center;gap:5px;border:0;background:none;padding:0 2px 0 0;margin-left:-8px;cursor:pointer;flex:none;color:var(--ink)}
.brand img{height:26px;width:auto;display:block;transform:rotate(-4deg)}
.brand span{display:flex;flex-direction:column;align-items:center;line-height:1;text-align:center}
.brand small{font:700 11.5px/1 var(--body);color:var(--ink);letter-spacing:.02em}
.brand small::before{content:"‘";margin-right:1px}.brand small::after{content:"’";margin-left:1px}  /* ‘국가유산’ */
.brand b{font:400 18px/1 "Jua",var(--body);color:var(--seal);letter-spacing:.01em;margin-top:2px;white-space:nowrap}
.brand:focus-visible{outline:2px solid var(--sea);outline-offset:2px;border-radius:8px}
.sdiv{width:1px;height:22px;background:var(--rule);flex:none;margin:0 2px}
@media (max-width:820px){.sbox:focus-within .brand span,.sbox:focus-within .sdiv{display:none}}  /* 검색할 때는 글자 칸을 넓게 */
.sbox input{flex:1;min-width:0;height:100%;border:0;background:none;color:var(--ink);font:500 15px/1 var(--body);outline:none}
.sbox input::placeholder{color:var(--muted);opacity:.85}
.sbox input::-webkit-search-cancel-button{display:none}
.sbox .ib{width:36px;height:36px;border-radius:50%;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.sbox:focus-within{box-shadow:0 0 0 2px var(--sea),var(--shadow)}
#qres{list-style:none;margin:6px 0 0;padding:6px;background:var(--sheet);border-radius:16px;box-shadow:var(--shadow);max-height:min(62dvh,460px);overflow:auto}
#qres li{display:flex;gap:10px;align-items:center;padding:10px 10px;border-radius:10px;cursor:pointer;font:500 14.5px/1.35 var(--body)}
#qres li svg{flex:none;color:var(--muted)}
#qres li.spot svg{color:var(--sea)}
#qres li[aria-selected="true"],#qres li:hover{background:var(--sea-soft)}
#qres li.more{color:var(--sea);justify-content:center;font-size:13px}
#qres li.empty{color:var(--muted);cursor:default;background:none;justify-content:center;font-size:13px}

/* 아래: 아이콘 줄 */
.nav{position:fixed;z-index:1200;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));height:58px;border-radius:20px;  /* 떠 있는 둥근 아이콘 줄 */
  background:var(--navbg);box-shadow:0 4px 16px rgb(0 0 0 / .18);display:grid;grid-template-columns:repeat(6,1fr)}
.nav button{border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--muted);position:relative}
.nav button svg{width:26px;height:26px}
.nav button[aria-current="true"]{color:var(--sea)}
.nav button[aria-current="true"]::after{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--sea)}
.nav button:focus-visible{outline:2px solid var(--sea);outline-offset:-4px}
.nav .cnt{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:16px;padding:0 4px;border-radius:8px;background:var(--seal);color:#fff;font:600 10px/16px var(--body);font-variant-numeric:tabular-nums}
#updown svg{transition:transform .25s}
body:not([data-p="closed"]) #updown svg{transform:rotate(180deg)}

/* 날씨 (왼쪽 아래) · 주변 유산 더보기 (오른쪽 아래) */
.wxc{position:fixed;z-index:1050;left:12px;bottom:calc(var(--navh) + var(--pv) + 2px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:6px;
  height:40px;padding:0 12px 0 10px;border:0;border-radius:20px;background:var(--sheet);box-shadow:var(--shadow);cursor:pointer;transition:bottom .28s cubic-bezier(.2,.8,.2,1);max-width:calc(100vw - 110px)}
.wxc .wx-i{font-size:19px;line-height:1}
.wxc b{font:700 16px/1 var(--body);font-variant-numeric:tabular-nums}
.wxc small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wxp{position:fixed;z-index:1060;left:12px;bottom:calc(var(--navh) + var(--pv) + 50px + env(safe-area-inset-bottom,0px));width:min(300px,calc(100vw - 24px));background:var(--sheet);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;font-size:13px;line-height:1.6}
.wxp b{font-weight:600}.wxp small{color:var(--muted)}
body[data-p="full"] .wxc,body[data-p="full"] .wxp{display:none}

/* 아래에서 올라오는 창 */
.panel{position:fixed;z-index:1150;left:10px;right:10px;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px));height:0;background:var(--sheet);border-radius:20px;
  box-shadow:0 -4px 18px rgb(0 0 0 / .14);display:flex;flex-direction:column;transition:height .28s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.panel.drag{transition:none}
.panel[data-s="closed"]{visibility:hidden}
.ph{flex:none;display:flex;align-items:center;gap:4px;padding:14px 8px 8px 16px;position:relative;touch-action:none;cursor:grab;user-select:none}
.ph::before{content:"";position:absolute;top:6px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:2px;background:var(--muted);opacity:.35}
.ph h2{flex:1;min-width:0;margin:0;font:700 17px/1.3 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph h2 small{font:500 12px/1 var(--body);color:var(--muted);margin-left:6px}
.ph .ib{width:38px;height:38px;border-radius:50%;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.ph .ib:hover{background:var(--paper)}
.ph .back{margin-left:-10px}
.pb{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:0 16px 20px}
.ib:focus-visible,.row:focus-visible,.pk-it:focus-visible{outline:2px solid var(--sea);outline-offset:-2px}

/* 창 안: 공통 */
.sec{margin-top:6px}
.sec h3{font:600 13px/1.3 var(--body);color:var(--muted);margin:14px 0 4px;display:flex;justify-content:space-between;align-items:baseline}
.sec h3 button{border:0;background:none;color:var(--sea);font:600 12.5px/1 var(--body);cursor:pointer;padding:4px 0}
.row{display:flex;align-items:center;gap:12px;width:100%;border:0;border-bottom:1px solid var(--rule);background:none;text-align:left;padding:11px 2px;cursor:pointer}
.row:hover{background:var(--paper)}
.ri{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--kh);color:#fff}
.ri svg{width:19px;height:19px}
.ri.sq{border-radius:9px}
.ri.done{background:var(--sheet);color:var(--seal);box-shadow:inset 0 0 0 2px var(--seal);transform:rotate(-8deg)}
.rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rt b{font:600 15px/1.35 var(--body)}
.rt small{font-size:12px;color:var(--muted)}
.rd{font:600 12.5px/1 var(--body);color:var(--me);font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{font:600 10.5px/1.6 var(--body);border-radius:4px;padding:0 5px;white-space:nowrap}
.tag.got{color:var(--seal);border:1.5px solid var(--seal);border-radius:50%;width:34px;height:34px;display:grid;place-items:center;padding:0;transform:rotate(-12deg);font-size:10px}
.st{display:inline-block;font:600 11px/1.6 var(--body);border-radius:4px;padding:0 6px;vertical-align:1px}
.st.open{background:var(--ok-soft);color:var(--ok)}
.st.soon{background:var(--warn-soft);color:var(--warn)}
.st.shut{background:var(--paper);color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:28px 10px;display:flex;flex-direction:column;align-items:center;gap:12px}
.btn{border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:8px 14px;font:500 13px/1.3 var(--body);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--sea);border-color:var(--sea);color:#fff}
.btn.redb{background:var(--seal);border-color:var(--seal);color:#fff}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 8px;position:sticky;top:0;background:var(--sheet);z-index:2}
.seg::-webkit-scrollbar{display:none}
.seg button{font:500 13px/1 var(--body);padding:8px 13px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.bar{height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--seal)}

/* 맛집 줄 */
.frow{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule);cursor:pointer;align-items:flex-start}
.frow .fimg{width:72px;height:72px;border-radius:10px;object-fit:cover;flex:none;background:var(--paper);display:grid;place-items:center;color:var(--food)}
.my-tag{font:600 10.5px/1.6 var(--body);background:var(--sea);color:#fff;border-radius:4px;padding:0 5px;margin-right:5px;vertical-align:2px}
.my-del{width:30px;height:30px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);color:var(--muted);cursor:pointer}
.inp{font:500 15px/1.3 var(--body);color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;width:100%}
.inp:focus{outline:2px solid var(--sea);outline-offset:1px}
.lbl small{color:var(--muted);font-size:11.5px}
.seg button:disabled{opacity:.4;cursor:default}
.fwrap{position:relative;flex:none;width:72px;height:72px}
.fwrap .fimg{width:72px;height:72px}
.ph-add{position:absolute;right:-6px;bottom:-6px;width:28px;height:28px;border-radius:50%;border:2px solid var(--sheet);background:var(--sea);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 1px 4px rgb(0 0 0 / .25)}
.ph-add svg{width:15px;height:15px}
.mine{position:absolute;left:4px;top:4px;font:600 9.5px/1.5 var(--body);background:rgb(0 0 0 / .55);color:#fff;border-radius:4px;padding:0 4px}
.frow .fimg svg{width:26px;height:26px;opacity:.75}
.frow .ft{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.frow .ft b{font:600 15px/1.35 var(--body)}
.frow .ft .mn{font-size:12.5px;color:var(--ink)}
.frow .ft .mn::before{content:"대표 ";color:var(--food);font-weight:600}
.frow .ft small{font-size:12px;color:var(--muted)}
.frow.ate{background:linear-gradient(90deg,color-mix(in srgb,var(--star) 14%,transparent),transparent 70%)}
.fr{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.nv{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:#03c75a;color:#fff;font:800 14px/1 var(--body);text-decoration:none}
.stars{display:inline-flex;gap:1px;margin-top:2px}
.stars button{border:0;background:none;padding:2px 1px;cursor:pointer;color:var(--rule);font-size:17px;line-height:1}
.stars button.on{color:var(--star)}
.stars em{font:500 11px/1 var(--body);color:var(--muted);font-style:normal;align-self:center;margin-right:4px}

/* 길 고르기 (1단계) */
.pk-it{display:flex;align-items:center;gap:12px;width:100%;border:0;border-bottom:1px solid var(--rule);background:none;text-align:left;padding:12px 2px;cursor:pointer}
.pk-it:hover{background:var(--paper)}
.pk-it.on{background:var(--sea-soft)}
.pk-d{width:12px;height:12px;border-radius:50%;flex:none}.pk-d.sq{border-radius:3px}
.pk-n{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.pk-n b{font:600 15px/1.3 var(--body)}.pk-n small{font-size:12px;color:var(--muted)}
.pk-c{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pk-done{font:700 10.5px/1 var(--body);color:var(--seal);border:1.5px solid var(--seal);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;transform:rotate(-12deg);flex:none}
.pk-g{font:600 12px/1 var(--body);color:var(--muted);padding:16px 2px 4px}
/* 길 안 유산 (2단계) */
.cinfo{padding:4px 0 8px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--rule)}
.cinfo .meta{font-size:12.5px;color:var(--muted)}
.num{width:34px;height:28px;border-radius:14px;background:var(--c);color:#fff;font:600 12px/28px var(--body);text-align:center;font-variant-numeric:tabular-nums;flex:none}
.num.sq{border-radius:6px;font-size:10.5px}
.num.done{background:var(--sheet);color:var(--seal);box-shadow:inset 0 0 0 2px var(--seal);transform:rotate(-8deg)}
.foods{display:flex;flex-wrap:wrap;gap:4px}
.foods span{font-size:12px;background:var(--paper);border-radius:6px;padding:2px 8px}

/* 장소 카드 (3단계) */
.pc-h{position:relative;padding:2px 0 10px}
.pc-h h3{font:700 20px/1.3 var(--display);margin:0 0 4px}
.pc-h .k{font-size:12.5px;color:var(--muted)}
.pc-h .s{font-size:13px;margin-top:4px}
.pc-h .s b{font-weight:600}
.pc-h .d{font-size:13px;color:var(--muted);margin-top:2px}
.pc-h .d .rd{margin-right:6px}
.pc-h.done{padding-right:112px;min-height:126px}
.fnote{color:var(--warn);font-size:12.5px;margin-top:4px}
.ph-row{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;margin:2px -16px 0;padding:0 16px 4px;scrollbar-width:none}
.ph-row::-webkit-scrollbar{display:none}
.ph-row img{height:128px;width:auto;max-width:78vw;aspect-ratio:4/3;object-fit:cover;border-radius:10px;scroll-snap-align:start;background:var(--rule);flex:none}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(48px,1fr));gap:4px;margin:12px 0 4px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:8px 0}
.act{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;cursor:pointer;color:var(--ink);text-decoration:none;font:500 11.5px/1.2 var(--body);border-radius:10px}
.act:hover{background:var(--paper)}
.act svg{width:24px;height:24px;color:var(--sea)}
.act.stamp svg{color:var(--seal)}
.act.stamp[aria-pressed="true"]{color:var(--seal);font-weight:700}
.act[aria-expanded="true"]{background:var(--sea-soft)}
.more details{border-bottom:1px solid var(--rule);padding:2px 0}
.more summary{cursor:pointer;padding:11px 2px;font:600 14px/1.3 var(--body);list-style:none;display:flex;justify-content:space-between}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:"›";color:var(--muted);transition:transform .2s}
.more details[open] summary::after{transform:rotate(90deg)}
.more summary small{color:var(--muted);font-weight:500;margin-left:6px}
.rest{list-style:none;margin:0 0 8px;padding:0}
.rest li{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;padding:6px 0;border-bottom:1px dotted var(--rule);font-size:13.5px}
.rest li img{width:40px;height:40px;object-fit:cover;border-radius:6px;flex:none;background:var(--rule)}
.rest li span{flex:1;min-width:0}
.rest small{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
dl.info{margin:4px 0 10px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
dl.info dt{color:var(--muted)} dl.info dd{margin:0;min-width:0;user-select:text}
.desc{margin:6px 0;line-height:1.75;font-size:13.5px}
.ev{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13px}
.ev li{display:flex;flex-direction:column}.ev small{color:var(--muted)}.ev a{color:var(--ink);font-weight:500}
.rt-box{border:1px solid var(--rule);border-radius:12px;margin-bottom:8px;padding:0 12px}
.rt-box summary{display:flex;align-items:center;gap:10px;padding:11px 0;cursor:pointer;list-style:none}
.rt-box summary::-webkit-details-marker{display:none}
.rt-n{width:24px;height:24px;border-radius:50%;background:var(--sea);color:#fff;font:700 12px/24px var(--body);text-align:center;flex:none}
.rt-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rt-t b{font:600 14px/1.3 var(--body)}
.rt-t small{font-size:11.5px;color:var(--muted);line-height:1.45}
.rt-box[open] summary .rt-t small{display:none}
.rt-l{list-style:none;margin:0;padding:0 0 10px}
.rt-l li{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px dotted var(--rule);font-size:13.5px}
.rt-l li .num{width:30px;height:22px;line-height:22px;font-size:11px}
.rt-l li span:nth-child(2){flex:1;min-width:0}
.rt-l li a{font:600 12px/1.2 var(--body);color:var(--sea);white-space:nowrap;text-decoration:none;background:var(--sea-soft);border-radius:8px;padding:5px 8px}
.rt-l li small{color:var(--muted);font-size:12px}
.rt-geo{display:flex;align-items:center;gap:10px;background:var(--sea-soft);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:12.5px}
.rt-geo span{flex:1}
.rt-geo .btn{min-height:34px;padding:6px 10px;white-space:nowrap}
a.row{text-decoration:none;color:inherit}
.trip-go{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--sea);background:var(--sea-soft);border-radius:12px;padding:11px 12px;margin:2px 0 10px;text-align:left;cursor:pointer;color:var(--ink)}
.rt-box .rd{display:flex;flex-direction:column;align-items:flex-end;gap:2px}.rt-box .rd small{font-weight:500;color:var(--muted);font-size:11px}
.meal{border-top:1px dotted var(--rule);padding:8px 0 6px;display:flex;flex-direction:column;gap:6px}
.meal-h{font:600 13px/1.3 var(--body)}.meal-h small{font-weight:500;color:var(--muted);font-size:11px;margin-left:4px}
.meal-it{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);background:var(--paper);border-radius:10px;padding:6px 8px}
.meal-it img,.meal-it .fimg{width:52px;height:52px;border-radius:8px;object-fit:cover;flex:none;display:grid;place-items:center;background:var(--rule);color:var(--food)}
.meal-it .fimg svg{width:22px;height:22px}
.meal-it .mn{color:var(--ink)}.meal-it .mn::before{content:"대표 ";color:var(--food);font-weight:600}
.stats{position:fixed;z-index:1090;left:12px;right:12px;top:calc(var(--topb) + 6px);display:grid;grid-template-columns:repeat(5,1fr);gap:5px}  /* 검색창과 같은 폭에 칩 다섯 개 */
@media (min-width:821px){.stats{right:auto;width:var(--pw)}}
.stats span,.stats button{display:inline-flex;align-items:center;justify-content:center;gap:3px;height:26px;padding:0 4px;min-width:0;overflow:hidden;border-radius:13px;border:0;background:rgb(255 255 255 / .92);color:var(--ink);
  font:600 11.5px/1 var(--body);box-shadow:0 1px 4px rgb(0 0 0 / .15);font-variant-numeric:tabular-nums;white-space:nowrap}
.stats small{font-weight:500;color:var(--muted)}
.stats button{cursor:pointer}.stats button[aria-pressed="true"]{color:var(--seal)}
body:not([data-p="closed"]) .stats{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stats span,:root:not([data-theme="light"]) .stats button{background:rgb(29 33 37 / .92)}}
.rt-note{font-size:11.5px;color:var(--muted);margin:2px 0 0}
.rt-pin{width:22px;height:22px;border-radius:50%;background:var(--sheet);color:var(--c);box-shadow:inset 0 0 0 2px var(--c),0 1px 3px rgb(0 0 0 / .3);font:800 11.5px/22px var(--body);text-align:center}
.pn-t{font:600 13px/1.3 var(--body);margin:16px 0 6px}
.pn-t small{font-weight:500;color:var(--muted);margin-left:4px;font-size:11.5px}
.pn{display:flex;gap:8px}
.pn button{flex:1;flex-direction:column;gap:2px;padding:8px 10px}
.pn button small{color:var(--me);font-weight:600;font-variant-numeric:tabular-nums}

/* 도장 (찍은 곳의 장소 카드 오른쪽 위) */
.seal{position:absolute;top:0;right:0;width:84px;height:84px;border-radius:50%;box-shadow:0 0 0 2.5px var(--seal),inset 0 0 0 5px var(--sheet),inset 0 0 0 6.5px var(--seal);
  display:grid;place-items:center;overflow:hidden;transform:rotate(-12deg);pointer-events:none;background:var(--sheet);opacity:.92}
.seal img{width:82%;height:82%;object-fit:contain;filter:saturate(1.15)}
.seal span{font:700 13px/1.15 var(--display);color:var(--seal);text-align:center;padding:0 10px;word-break:keep-all}
.seal small{position:absolute;bottom:7px;left:0;right:0;text-align:center;font:600 8.5px/1 var(--body);color:var(--seal);letter-spacing:.04em}
.seal.myh{--r:-6deg;--o:1;width:94px;height:94px;top:20px;right:12px;box-shadow:none;background:none;border-radius:0;overflow:visible;opacity:1;transform:rotate(-6deg);display:block}
.seal.myh .frame{width:100%;height:100%;object-fit:contain;filter:none;display:block}
.seal.myh b{position:absolute;left:15%;right:15%;top:51%;height:31%;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;text-align:center;font:700 10.5px/1.12 var(--body);color:#131416;word-break:keep-all;overflow-wrap:anywhere;letter-spacing:-.03em}
.seal.myh b i{display:block;font-weight:600;font-size:.72em;line-height:1.2;font-style:normal;margin-bottom:1px;white-space:nowrap}
.seal.myh .cert{position:absolute;top:-6px;right:-10px;width:36px;height:36px;transform:rotate(-10deg)}
.seal.myh.thud .cert{animation:thud2 .45s .32s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes thud2{0%{transform:scale(2.6) rotate(20deg);opacity:0}60%{transform:scale(.9) rotate(-10deg);opacity:1}100%{transform:scale(1) rotate(-10deg)}}
.seal.thud{animation:thud .5s cubic-bezier(.2,.9,.3,1.25) both}
.pc.thudcard{animation:shake .35s .28s ease-out}
@keyframes thud{0%{transform:scale(2.8) rotate(-30deg);opacity:0}55%{transform:scale(.88) rotate(var(--r,-12deg));opacity:1}75%{transform:scale(1.04) rotate(var(--r,-12deg))}100%{transform:scale(1) rotate(var(--r,-12deg));opacity:var(--o,.92)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translate(1px,2px)}50%{transform:translate(-1px,-1px)}75%{transform:translate(1px,0)}}

/* 인증 */
.cert-top{display:flex;align-items:center;gap:14px;padding:4px 0 10px}
.cert-top .big{font:700 30px/1 var(--display);color:var(--seal);font-variant-numeric:tabular-nums}
.cert-top .big small{font:500 14px/1 var(--body);color:var(--muted);margin-left:4px}
.cert-img{width:100%;border-radius:12px;border:1px solid var(--rule);display:block;background:var(--paper);aspect-ratio:1080/1350}
.cert-acts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.cert-acts.one{flex-wrap:nowrap}.cert-acts.one .btn{flex:1;padding:8px 6px;white-space:nowrap}
.cr{padding:0;border-bottom:1px solid var(--rule)}
.cr summary{display:block;cursor:pointer;list-style:none;padding:12px 0}
.cr summary::-webkit-details-marker{display:none}
.cr .bar{display:block}
.cr-h::after{content:"▾";color:var(--muted);margin-left:2px;transition:transform .2s}
.cr[open] .cr-h::after{transform:rotate(180deg)}
.cr[data-full] .cr-h::after{content:""}
.cr[open] .cr-l{margin:0 0 12px}
.cr-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.cr-h b{flex:1;font:600 14.5px/1.3 var(--body)}
.cr-h span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.cr-l{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.cr-l button{border:1px dashed var(--muted);background:none;border-radius:8px;padding:4px 9px;font:500 12.5px/1.3 var(--body);cursor:pointer;color:var(--ink)}
.cr-l button:hover{border-style:solid;border-color:var(--sea);color:var(--sea)}
.cr.full .cr-h b{color:var(--seal)}
.src{font-size:11px;line-height:1.7;color:var(--muted);margin-top:18px}
.src a{color:var(--muted)}

/* 지도 표시 */
.hk{width:26px;height:26px;border-radius:50%;background:var(--kh);color:#fff;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px rgb(0 0 0 / .35)}
.hk svg{width:15px;height:15px}
.hk.big{width:40px;height:40px;box-shadow:0 0 0 6px color-mix(in srgb,var(--kh) 30%,transparent),0 2px 8px rgb(0 0 0 / .35)}
.hk.big svg{width:23px;height:23px}
.sp{width:32px;height:32px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--c);border:2px solid #fff;box-shadow:0 2px 6px rgb(0 0 0 / .35);display:grid;place-items:center;position:relative}
.sp svg{width:17px;height:17px;color:#fff;transform:rotate(45deg)}
.sp.sq{border-radius:7px 7px 7px 2px}
.sp b{position:absolute;top:-9px;right:-11px;transform:rotate(45deg);background:var(--sheet);color:var(--ink);border-radius:8px;font:700 10px/15px var(--body);padding:0 4px;box-shadow:0 1px 3px rgb(0 0 0 / .3);font-variant-numeric:tabular-nums;white-space:nowrap}
/* 도장 받은 곳: 작고 옅은 회색으로 물러나서, 남은 핀이 점점 줄어드는 게 보이게 (고른 곳은 다시 또렷하게) */
.sp.done{background:#9aa0a6;opacity:.5;transform:rotate(-45deg) scale(.6);transform-origin:0 100%;box-shadow:0 1px 2px rgb(0 0 0 / .2);border-width:1.5px}
.sp.done b{display:none}
.sp.done.sel{opacity:1;background:var(--seal);transform:rotate(-45deg)}
.sp.done.sel b{display:block}
/* '도장 받은 곳만' 켜면: 받은 곳 핀만, 다시 또렷한 인주색 + ✓ */
.sbox .ib.only[aria-pressed="true"]{background:var(--sea-soft);color:var(--sea)}  /* 켜졌을 때 연한 파랑 */
body.done-only .sp.done{opacity:1;background:var(--seal);transform:rotate(-45deg)}
body.done-only .sp.done::after{content:"✓";position:absolute;bottom:-6px;left:-6px;transform:rotate(45deg);width:16px;height:16px;border-radius:50%;background:#fff;color:var(--seal);font:900 11px/16px var(--body);text-align:center;box-shadow:0 1px 3px rgb(0 0 0 / .3)}
.sp.sel{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 35%,transparent),0 2px 8px rgb(0 0 0 / .4)}
.fk{width:24px;height:24px;border-radius:50%;background:var(--food);color:#fff;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px rgb(0 0 0 / .35)}
.fk svg{width:13px;height:13px}
.fk.ate{background:var(--star)}
.qpin{width:18px;height:18px;border-radius:50%;background:var(--sea);border:3px solid #fff;box-shadow:0 0 0 2px var(--sea),0 2px 6px rgb(0 0 0 / .3)}

/* 위쪽 알림: 근처 도장 · 음성 해설 · 짧은 안내 */
.nearbar,.player,.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--topb) + 6px);z-index:1300;width:min(560px,calc(100vw - 24px));background:var(--sheet);color:var(--ink);border-radius:14px;box-shadow:0 6px 20px rgb(0 0 0 / .22)}
.nearbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;border:2px solid var(--seal);padding:9px 10px;font:500 13px/1.45 var(--body)}
.nearbar span{flex:1 1 200px}
.nearbar button{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:5px 10px;font:600 12.5px/1.2 var(--body);cursor:pointer;min-height:32px}
.nearbar [data-go]{background:var(--seal);border-color:var(--seal);color:#fff}
.nearbar [data-x]{border:0;padding:5px 6px}
.player{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 14px;font-size:12.5px}
.player audio{flex:1;min-width:0;height:34px}
.player b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34%}
.player .ib{border:0;background:none;width:32px;height:32px;cursor:pointer}
.toast{padding:10px 14px;font-size:13px;text-align:center;width:auto;max-width:calc(100vw - 24px)}
.fin-box{background:var(--sheet);color:var(--ink);border-radius:20px;padding:26px 20px 18px;width:min(360px,100%);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.fin-box h3{font:700 19px/1.35 var(--display);margin:4px 0 0}
.fin-box .mt{color:var(--muted);font-size:13px;margin:0}
.fin-box .acts2{display:flex;gap:8px;margin-top:6px}
.fin-seal{width:150px;height:150px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--seal);
  box-shadow:0 0 0 5px var(--seal),inset 0 0 0 8px var(--sheet),inset 0 0 0 10px var(--seal);transform:rotate(-12deg);animation:thud .6s cubic-bezier(.2,.9,.3,1.25) both}
.fin-seal b{font:400 40px/1 "Jua",var(--display);letter-spacing:.04em}
.fin-seal small{font:600 11px/1.3 var(--body);max-width:110px}
.modal{position:fixed;inset:0;z-index:3000;background:rgb(0 0 0 / .45);display:grid;place-items:center;padding:16px}
.sheet-box{background:var(--sheet);color:var(--ink);border-radius:16px;padding:18px;width:min(460px,100%);max-height:calc(100dvh - 32px);overflow:auto;display:flex;flex-direction:column;gap:10px}
.sheet-box h3{font:700 1.05rem/1.3 var(--body);margin:0}
.sheet-box .mt{color:var(--muted);font-size:12.5px;margin:0}
.sheet-box .acts2{display:flex;gap:8px;flex-wrap:wrap}
.sheet-box [data-close]{align-self:flex-end}
.lbl{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.lbl textarea{font:500 13px/1.4 ui-monospace,monospace;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:8px;resize:vertical;word-break:break-all}
.inapp{position:fixed;left:8px;right:8px;top:max(8px,env(safe-area-inset-top,0px));z-index:3000;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:var(--ink);color:var(--sheet);border-radius:10px;padding:8px 10px;font:500 12.5px/1.4 var(--body);box-shadow:0 4px 16px rgb(0 0 0 / .25)}
.inapp span{flex:1 1 140px}
.inapp a,.inapp button{color:var(--sheet);background:none;border:1px solid currentColor;border-radius:6px;padding:3px 8px;font:inherit;text-decoration:none;cursor:pointer}
.inapp [data-x]{border:0;padding:3px 4px}

/* PC: 왼쪽에 검색창·창·아이콘 줄을 한 줄기로 (지도는 오른쪽까지 전부) */
@media (min-width:821px){
  :root{--pw:400px;--navh:58px}
  .top{right:auto;width:var(--pw)}
  .nav{left:12px;right:auto;bottom:12px;width:var(--pw);border-radius:16px}
  .panel{left:12px;right:auto;width:var(--pw);top:calc(var(--topb) + 12px);bottom:calc(var(--navh) + 20px);height:auto!important;border-radius:16px;box-shadow:var(--shadow);transition:none}
  .panel[data-s="closed"]{display:none}
  .ph{cursor:default}.ph::before{display:none}
  .leaflet-bottom{bottom:0}
  .wxc{left:calc(var(--pw) + 24px);bottom:12px}
  .wxp{left:calc(var(--pw) + 24px);bottom:60px}
  body[data-p="full"] .wxc{display:flex}
  .ph-row img{max-width:300px}
}
@media (max-width:820px){.leaflet-control-zoom{display:none}
  .wxc{left:auto;right:12px}.wxp{left:auto;right:12px}}  /* 휴대폰: 날씨는 오른쪽 아래, 지도 출처 글(OSM 이용 조건상 보여야 함)은 검색창 밑 오른쪽 위에 작게 */
@media (max-width:820px){.leaflet-top.leaflet-right{top:calc(var(--topb) + 34px)}.leaflet-top .leaflet-control-attribution{margin:0 12px 0 0;font-size:9px;opacity:.75;border-radius:0 0 6px 6px}}

<script>
// 코스 색: 1/2구간으로 나뉜 길은 같은 계열의 진한색(1)/밝은색(2)
const COLOR={"1":"#a0522d","2":"#2f7fb0","3":"#7a4fa3","4":"#2e8b57","5":"#5f6b78","6":"#8d7b5a",
  "7":"#c0392b","8-1":"#c27a00","8-2":"#e0a93a","9-1":"#8a4d12","9-2":"#c58a3d","10":"#8e44ad",
  "11":"#1f4e9c","12":"#e0622a","13":"#3d6b4f","14":"#0f7c86","15":"#b03a68"};

const C=window.COURSES;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// 링크·이미지 주소는 http(s)와 이 사이트의 stamps/ 그림만 (javascript: 같은 주소는 막음)
const url=u=>/^(https?:\/\/|stamps\/|blob:)/i.test(String(u||""))?esc(u):"#";  // blob: = 내가 찍은 식당 사진(이 기기 안)

function hav(a,b,c,d){const R=6371000,t=Math.PI/180,x=Math.sin((c-a)*t/2)**2+Math.cos(a*t)*Math.cos(c*t)*Math.sin((d-b)*t/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
const partOf=c=>(c.key.match(/-(\d)$/)||[])[1];          // "8-2" → "2"

const gc=(path,title)=>{try{window.goatcounter&&window.goatcounter.count&&window.goatcounter.count({path,title:title||path,event:true});}catch(e){}};

  area:'<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6.5 9 4l6 2.5L21 4v13.5L15 20l-6-2.5L3 20z"/></svg>'
};

const map=L.map("map",{zoomControl:false,zoomSnap:.25})  /* 0.25 단계로 맞춰 우리나라가 화면에 꽉 차게 */.setView([36.3,127.8],7);

map.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');
const attrPos=()=>map.attributionControl.setPosition(matchMedia("(max-width:820px)").matches?"topright":"bottomright"); attrPos();

const spotLayer=L.layerGroup().addTo(map), foodLayer=L.layerGroup().addTo(map), meLayer=L.layerGroup().addTo(map),
  khsLayer=L.layerGroup().addTo(map), nearestLayer=L.layerGroup().addTo(map), searchLayer=L.layerGroup().addTo(map);

let doneOnly=false, openOnly=false, mode="", pstate="closed", cur="", stage=1, spotNum="", filter="all", me=null, markers={}, nearest=null, wxFollow="me";

// 스탬프 체크: 이 브라우저에만 저장. 같은 번호(예: 83 종묘)는 왕가의 길 1·2에서 함께 체크된다

const saveStamps=()=>{try{localStorage.setItem("hcm-stamps",JSON.stringify([...stamps]))}catch(e){}};
const done=c=>c.spots.filter(s=>stamps.has(s.num)).length;

// 맛집 별점: 먹어 본 곳만 (이 브라우저에만 저장)

  coffee_shop:"커피",coffee:"커피",bakery:"빵",cake:"케이크",dessert:"디저트",barbecue:"고기구이",bbq:"고기구이",seafood:"해산물",sushi:"초밥",ramen:"라멘",kimbap:"김밥",tea:"차",regional:"향토"};

const phDB=(()=>{let db=null; const open=()=>db||(db=new Promise((ok,no)=>{try{const r=indexedDB.open("hcm",1); r.onupgradeneeded=()=>r.result.createObjectStore("foodPhoto"); r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error);}catch(e){no(e);}}));
  const st=(m)=>open().then(d=>d.transaction("foodPhoto",m).objectStore("foodPhoto"));
  const go=q=>new Promise((ok,no)=>{q.onsuccess=()=>ok(q.result); q.onerror=()=>no(q.error);});
  return {set:(k,v)=>st("readwrite").then(o=>go(o.put(v,k))), del:k=>st("readwrite").then(o=>go(o.delete(k))),
    all:()=>st("readonly").then(o=>Promise.all([go(o.getAllKeys()),go(o.getAll())]))};})();

let phKey="";
async function savePhoto(file){
  const im=await createImageBitmap(file), z=Math.min(1,520/Math.max(im.width,im.height)), cv=document.createElement("canvas");
  cv.width=Math.round(im.width*z); cv.height=Math.round(im.height*z); cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
  const b=await new Promise(r=>cv.toBlob(r,"image/jpeg",.82)); await phDB.set(phKey,b);

// ── 오늘 운영 상태 (스탬프 이용 가능 시간 기준, 공휴일은 반영 안 함)
const toMin=t=>{const[h,m]=t.split(":").map(Number);return h*60+m};
// 현장에서 확인한 휴무(엑셀): '월', '화, 새해첫날', '매월 18일', '첫주 수' — 설·추석(음력)은 계산하지 않음
function fieldClosed(s,now){
  const c=s.field&&s.field.closed; if(!c) return false;
  const W="일월화수목금토", dow=now.getDay(), date=now.getDate(), mon=now.getMonth()+1;
  return c.split(/[,，]/).map(x=>x.trim()).some(x=>{
    if(x.length===1&&W.includes(x)) return W.indexOf(x)===dow;
    let m=x.match(/첫\s*주\s*([일월화수목금토])/); if(m) return W.indexOf(m[1])===dow&&date<=7;
    m=x.match(/매월\s*(\d+)일/); if(m) return +m[1]===date;
    return x==="새해첫날"&&mon===1&&date===1;});
}
function status(s,now=new Date()){
  if(fieldClosed(s,now)) return {cls:"shut",text:"오늘 휴무"};
  const h=s.sched; if(!h) return null;
  if(h.always) return {cls:"open",text:"상시 가능"};
  const dow=now.getDay(), mon=now.getMonth()+1, date=now.getDate();
  let closed=(h.closed||[]).includes(dow);
  if(closed&&h.openOnMarketDay&&(date%10===2||date%10===7)) closed=false;
  if(h.closedFirstWed&&dow===3&&date<=7) closed=true;
  if((h.closedFirst||[]).includes(dow)&&date<=7) closed=true; // 매월 첫째 ○요일
  if(closed) return {cls:"shut",text:"오늘 휴무"};
  const p=(h.periods||[]).find(p=>!p.months||p.months.includes(mon)); if(!p) return null;
  const [o,c]=(h.byDay&&h.byDay[dow])||[p.open,p.close];
  const t=now.getHours()*60+now.getMinutes();
  if(t<toMin(o)) return {cls:"shut",text:`${o} 열림`};
  if(t>=toMin(c)) return {cls:"shut",text:"오늘 운영 끝"};
  if(toMin(c)-t<=60) return {cls:"soon",text:`곧 마감 ${c}`};
  return {cls:"open",text:`운영 중 ~${c}`};
}
const stBadge=s=>{const x=status(s);return x?`<span class="st ${x.cls}">${x.text}</span>`:""};

// ── 화면 자리 계산: 지도에서 '가리지 않은 부분'(검색창 아래 ~ 창·아이콘 줄 위, PC는 왼쪽 창 오른쪽)
const MQ=matchMedia("(max-width:820px)"), mobile=()=>MQ.matches;
const panel=$("panel"), pb=$("pb"), nav=$("nav"), topEl=$("top");
const topB=()=>topEl.querySelector(".sbox").getBoundingClientRect().bottom;
const navTop=()=>nav.getBoundingClientRect().top;
function panelH(s){
  if(s==="closed") return 0;

  return s==="full"?Math.round(avail):Math.round(avail*.5);
}
const pv=()=>mobile()?panelH(pstate):0;
const MAPV=()=>mobile()?"closed":"full";  // 지도로 보여 줄 때: 휴대폰은 창을 내려 지도만 (보던 창은 ↑로 다시)
function vis(){
  if(mobile()) return {l:0,t:topB(),r:innerWidth,b:navTop()-(pstate==="full"?0:pv())};  // 창이 화면을 다 덮을 때는 창을 내렸을 때의 지도 기준으로
  return {l:pstate==="closed"?0:panel.getBoundingClientRect().right,t:0,r:innerWidth,b:innerHeight};
}
function fitTo(b,maxZoom=15){

}

  const g=vis(); map.panBy([Math.round(innerWidth/2-(g.l+g.r)/2),Math.round(innerHeight/2-(g.t+g.b)/2)],{animate:false});
}
function visibleBounds(){const g=vis(); return L.latLngBounds(map.containerPointToLatLng([g.l,g.t]),map.containerPointToLatLng([g.r,g.b]));}

// ── 전국 국가유산 1.2만 곳 (heritage_all.js, 1MB라 처음 필요할 때 불러온다) → 확대하면 화면 안 유산을 아이콘으로
let KHS=null, khsLoading=null;
function loadKHS(){

    s.onload=()=>{KHS=window.KHS_ALL.map(r=>({name:r[0],kind:window.KHS_KINDS[r[1]]||"",lat:r[2],lng:r[3],code:r[4]})); ok(KHS);};

const myhUrl=h=>{const[kd,asno,ctcd,cpno]=h.code.split("|");return `https://my.heritage.go.kr/public/commentary/culSelectDetail.do?ccbaKdcd=${kd}&ccbaAsno=${asno}&ccbaCtcd=${ctcd}&ccbaCpno=${cpno}`};

const courseNames=new Set(uniqSpots.map(x=>x.s.name.replace(/\s/g,"")));

const DAEJEON=[36.3504,127.3845];

function zoomAnchor(){  // 확대 기준점: 내 위치 › 고른 길 › 대전
  if(me) return L.latLng(me.lat,me.lng);

  return c?L.latLngBounds(c.spots.map(s=>[s.lat,s.lng])).getCenter():L.latLng(DAEJEON);
}
function zoomBy(d){  // PC의 +/− 단추도 같은 기준점으로
  const z=Math.max(map.getMinZoom(),Math.min(map.getMaxZoom(),map.getZoom()+d)), a=zoomAnchor();
  if(visibleBounds().contains(a)) map.setZoomAround(a,z); else showOnMap(a,z);
}
map.zoomIn=function(d){zoomBy(d||1);return this;};

// 가장 가까운 국가유산 (전국 목록 + 방문코스) — 큰 아이콘으로
function findNearest(pt){

// 검색창 밑 통계 (GoatCounter 공개 숫자): 조회 = 열린 횟수, 방문 = 다녀간 사람, 좋아요 = 이 단추, 공유 = 앱 안 공유 단추

// GoatCounter 공개 숫자는 같은 주소면 몇 시간씩 저장본(캐시)을 준다 → 시작일을 사이트를 연 날(10-22)보다 이른 날 중에서 한 시간마다 바꿔 늘 새 숫자를 받는다
const gcStart=()=>new Date(Date.UTC(2025,0,1)+(Math.floor(Date.now()/36e5)%600)*864e5).toISOString().slice(0,10);
const gcNum=path=>fetch(`https://heritage-course-map.goatcounter.com/counter/${path}.json?start=${gcStart()}`).then(r=>r.ok?r.json():null).catch(()=>null);
const toN=v=>+String((v&&v.count)||"0").replace(/\D/g,"");
const fmt=n=>n>=10000?(n/10000).toFixed(n<100000?1:0)+"만":n.toLocaleString("ko-KR");
async function loadStats(){
  const P=["TOTAL","like","share-spot","share-cert","share-shot","stamp"];
  let [tot,lk,s1,s2,s3,st]=await Promise.all(P.map(gcNum));
  if(!tot){  // GoatCounter 주소가 막히면(삼성 인터넷 추적 방지·광고 차단 등) 한 시간마다 옮겨 두는 사이트 안 파일로
    const j=await fetch("stats.json?"+Math.floor(Date.now()/6e5)).then(r=>r.ok?r.json():null).catch(()=>null);
    if(j) [tot,lk,s1,s2,s3,st]=P.map(k=>j[k]||null);
  }
  // 숫자를 못 받아도(광고 차단·학교망 등) 칸은 보이게 '–'로
  const views=toN(tot), people=tot?+String(tot.count_unique||"0").replace(/\D/g,""):0, likes=toN(lk), shares=toN(s1)+toN(s2)+toN(s3), seals=toN(st);
  const el=$("stats"), F=n=>tot?fmt(n):"–";
  el.innerHTML=`<span title="이 지도가 열린 횟수">👁 ${F(views)}<small>조회</small></span><span title="다녀간 사람 수">👤 ${F(people)}<small>방문</small></span>
    <button type="button" data-like aria-pressed="${liked}" title="${liked?"좋아요를 눌렀어요":"이 지도가 마음에 들면"}">${liked?"♥":"♡"} ${F(likes)}<small>좋아요</small></button><span title="앱 안 공유 단추를 누른 횟수">↗ ${F(shares)}<small>공유</small></span><span title="모두가 찍은 도장 수">🏅 ${F(seals)}<small>도장</small></span>`;
  el.hidden=false;
  el.querySelector("[data-like]").onclick=e=>{if(liked) return; liked=true; try{localStorage.setItem("hcm-liked2","1")}catch(_){} gc("like","좋아요");
    const b=e.currentTarget; b.setAttribute("aria-pressed","true"); b.innerHTML=`♥ ${F(likes+1)}<small>좋아요</small>`; toast("좋아요 고마워요!");};
}

// ── 1) 내 위치: 가까운 유산 / 가까운 식당을 나눠서
function nearHeritage(pt,n){
  const out=uniqSpots.map(x=>({t:"spot",c:x.c,s:x.s,name:x.s.name,d:hav(pt.lat,pt.lng,x.s.lat,x.s.lng)}));
  (KHS||[]).forEach(h=>{if(Math.abs(h.lat-pt.lat)<.2&&Math.abs(h.lng-pt.lng)<.25&&!courseNames.has(h.name.replace(/\s/g,""))) out.push({t:"khs",h,name:h.name,d:hav(pt.lat,pt.lng,h.lat,h.lng)});});
  return out.sort((a,b)=>a.d-b.d).slice(0,n);
}
const nearFoods=(pt,n)=>FOODS.map(f=>({...f,d:hav(pt.lat,pt.lng,f.lat,f.lng)})).sort((a,b)=>foodRank(a)-foodRank(b)).slice(0,n);

  ?`<button class="row" type="button" data-spot="${x.c.key}|${esc(x.s.num)}"><span class="ri${x.c.group===2?" sq":""}${stamps.has(x.s.num)?" done":""}" style="${stamps.has(x.s.num)?"":`background:${COLOR[x.c.key]}`}">${I.roof}</span>

// 추천 동선: 길의 유산을 한 번씩 들르는 가장 짧은 순서(직선거리, 12곳 이하라 전부 따져 봄)
// 내 위치가 있으면 내 위치에서 출발: ① 전체 유산 ② 아직 도장 안 받은 곳만(받은 곳이 있을 때) 또는 '가까운 곳부터 차례로'
// 내 위치가 없으면 ① 가장 짧은 순서 ② 그 반대쪽 끝에서 시작
function shortest(pts,from,back){  // from: 고정 출발점(없으면 어디서 시작해도 됨), back: 끝나고 from으로 돌아오기
  const n=pts.length, D=pts.map(a=>pts.map(b=>hav(a.lat,a.lng,b.lat,b.lng))), full=(1<<n)-1;
  const dp=Array.from({length:1<<n},()=>new Float64Array(n).fill(Infinity)), par=Array.from({length:1<<n},()=>new Int8Array(n).fill(-1));
  for(let k=0;k<n;k++) dp[1<<k][k]=from?hav(from.lat,from.lng,pts[k].lat,pts[k].lng):0;
  for(let m=1;m<=full;m++) for(let j=0;j<n;j++){const v=dp[m][j]; if(v===Infinity) continue;
    for(let k=0;k<n;k++) if(!(m&1<<k)){const w=v+D[j][k], mm=m|1<<k; if(w<dp[mm][k]){dp[mm][k]=w; par[mm][k]=j;}}}
  const endCost=j=>dp[full][j]+(back&&from?hav(pts[j].lat,pts[j].lng,from.lat,from.lng):0);
  let e=0; for(let j=1;j<n;j++) if(endCost(j)<endCost(e)) e=j;
  const path=[]; for(let m=full,j=e;j>=0;){path.unshift(pts[j]); const pj=par[m][j]; m&=~(1<<j); j=pj;}
  return {len:endCost(e),path,from:from||null,back:!!(back&&from)};
}
function nearestFirst(pts,from){  // 가까운 곳부터 차례로(매번 지금 자리에서 가장 가까운 곳)
  const left=[...pts], path=[]; let at=from, len=0;
  while(left.length){let b=0; left.forEach((x,i)=>{if(hav(at.lat,at.lng,x.lat,x.lng)<hav(at.lat,at.lng,left[b].lat,left[b].lng)) b=i;});
    len+=hav(at.lat,at.lng,left[b].lat,left[b].lng); at=left.splice(b,1)[0]; path.push(at);}
  return {len,path,from};
}
const sameOrder=(a,b)=>a.path.length===b.path.length&&a.path.every((x,i)=>x===b.path[i]);
function routes(c){
  if(c.spots.length<2||c.spots.length>12) return [];
  if(me){
    const from={name:"내 위치",lat:me.lat,lng:me.lng}, a={...shortest(c.spots,from),label:"내 위치에서 가장 짧은 동선"}, left=c.spots.filter(s=>!stamps.has(s.num));
    let b=null;

    else{const r=nearestFirst(c.spots,from); if(!sameOrder(r,a)) b={...r,label:"가까운 곳부터 차례로"};}
    return b?[a,b]:[a];
  }
  if(c.spots.length<3) return [];

  return [{...a,label:"가장 짧은 순서"},{...a,path:[...a.path].reverse(),label:`${end.name.split(" (")[0]}에서 시작(반대 방향)`}];
}
// 동선 시간 어림: 직선거리×1.4를 시속 60km로, 한 곳에서 1시간 머문다고 보고
const DRIVE=m=>m*1.4/1000;  // 분
const hm=min=>{min=Math.round(min); return min<60?`${min}분`:`${Math.floor(min/60)}시간${min%60?` ${min%60}분`:""}`;};
function timeline(r){
  const t=[]; let at=r.from, now=Date.now();
  r.path.forEach(x=>{if(at) now+=DRIVE(hav(at.lat,at.lng,x.lat,x.lng))*60e3; t.push(now); now+=60*60e3; at=x;});
  if(r.back) now+=DRIVE(hav(at.lat,at.lng,r.from.lat,r.from.lng))*60e3;
  return {arr:t,end:now};
}
// 삼시세끼: 지금부터 다음 세 끼(아침 8시·점심 12시 30분·저녁 6시 30분)를 동선에서 그 시간에 있을 곳 근처 맛집으로

  slots.forEach(sl=>{
    let j=0; arr.forEach((a,i)=>{if(Math.abs(a-sl.t)<Math.abs(arr[j]-sl.t)) j=i;});
    const x=r.path[j], f=(x.restaurants||[]).filter(f=>!used.has(fKey(f))).sort((a,b)=>(!fPhoto(b)-!fPhoto(a))||(!b.menu-!a.menu)||(a.dist-b.dist))[0];

function afterStamp(){

function stampNow(n){
  if(stamps.has(n)) return;
  const was=new Set(C.filter(c=>c.spots.every(s=>stamps.has(s.num))).map(c=>c.key));
  stamps.add(n); saveStamps(); afterStamp(); gc("stamp","도장 찍기");
  const fin=C.filter(c=>!was.has(c.key)&&c.spots.every(s=>stamps.has(s.num)));
  if(fin.length) setTimeout(()=>celebrate(fin),900);  // 도장이 쿵 찍힌 다음에
  const sl=pb.querySelector(".pc .seal"), a=pb.querySelector(".pc");
  if(sl){sl.classList.add("thud"); a.classList.add("thudcard"); setTimeout(()=>a.classList.remove("thudcard"),700);}  // 쿵: 도장이 내려찍히고 카드가 살짝 흔들림
  try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}
}

  if(cur&&spotNum&&mode==="course"&&stage===3) return (spotOf(cur,spotNum)||{}).s;

  return b&&b.s;
}

function modal(html){
  const m=document.createElement("div"); m.className="modal"; m.setAttribute("role","dialog"); m.setAttribute("aria-modal","true");
  m.innerHTML=`<div class="sheet-box">${html}<button type="button" class="btn" data-close>닫기</button></div>`;
  m.onclick=e=>{if(e.target===m||e.target.closest("[data-close]")) m.remove();};
  document.addEventListener("keydown",function k(e){if(e.key==="Escape"){m.remove(); document.removeEventListener("keydown",k);}});
  document.body.appendChild(m); return m;
}
let toastT=null;
function toast(t){let d=$("toast"); if(!d){d=document.createElement("div"); d.id="toast"; d.className="toast"; d.setAttribute("role","status"); document.body.appendChild(d);}
  d.textContent=t; d.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{d.hidden=true;},3200);}
// 예전에 만든 옮기기 링크(#s=…)·백업 코드(HCM1.…)로 열면 도장을 합칠지 묻는다
function readCode(s){
  const m=String(s||"").trim().match(/HCM1\.([0-9A-Z.]*)/)||String(s||"").match(/[#&]s=([0-9A-Z.]+)/);
  if(!m) return null; return m[1].split(".").filter(n=>allNums.includes(n));
}
function mergeStamps(nums,from){
  const add=nums.filter(n=>!stamps.has(n));
  if(!add.length){alert(`${from}의 도장 ${nums.length}곳은 이미 모두 찍혀 있어요.`); return;}
  if(!confirm(`${from}에서 도장 ${add.length}곳을 더할까요? (지금 찍힌 ${stamps.size}곳은 그대로 둡니다)`)) return;
  add.forEach(n=>stamps.add(n)); saveStamps(); afterStamp();
}
(function(){const nums=readCode(location.hash); if(nums&&nums.length){history.replaceState(null,"",location.pathname+location.search); setTimeout(()=>mergeStamps(nums,"옮기기 링크"),400);}})();

const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;

if("serviceWorker" in navigator&&location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});

  const ios=/iPhone|iPad|iPod/i.test(navigator.userAgent), sam=/SamsungBrowser/i.test(navigator.userAgent);

    <p class="mt">설치하면 주소창 없이 앱처럼 열리고, 한 번 연 화면과 자료는 신호가 약한 유적지에서도 열려요. (지도 바탕은 인터넷이 필요해요)</p>`);
}

const audio=$("audio"), player=$("player");

$("playerClose").onclick=()=>{audio.pause(); player.hidden=true;};

// ── 근처 도장 안내: 아직 안 찍은 유산 200m 안에 들어오면 위에 띠를 띄운다 (자동으로 찍지는 않음)
const NEAR_M=200, nearSkip=new Set();
function nearCheck(pt){
  let best=null;
  uniqSpots.forEach(({c,s})=>{if(stamps.has(s.num)||nearSkip.has(s.num)) return;
    const d=hav(pt.lat,pt.lng,s.lat,s.lng)-Math.min(pt.acc||0,100); if(d<=NEAR_M&&(!best||d<best.d)) best={d,c,s};});
  const old=$("nearBar");
  if(!best){if(old) old.remove(); return;}
  if(old&&old.dataset.n===best.s.num) return;
  if(old) old.remove();
  const b=document.createElement("div"); b.id="nearBar"; b.className="nearbar"; b.dataset.n=best.s.num; b.setAttribute("role","status");
  b.innerHTML=`<span><b>${esc(best.s.name)}</b> 근처예요 (${km(Math.max(0,best.d))}) · 스탬프: ${esc(best.s.stamp||"현장 안내 확인")}</span>
    <button type="button" data-go>도장 찍기</button><button type="button" data-card>카드 보기</button><button type="button" data-x aria-label="나중에">✕</button>`;
  const off=()=>{b.remove(); nearSkip.add(best.s.num);};
  b.querySelector("[data-go]").onclick=()=>{off(); openSpot(best.c.key,best.s.num); stampNow(best.s.num);};
  b.querySelector("[data-card]").onclick=()=>{off(); openSpot(best.c.key,best.s.num);};
  b.querySelector("[data-x]").onclick=off;
  document.body.appendChild(b);
}

// ── 내 위치: 처음 열면 바로 찾아서 골목이 보일 만큼 확대, 가장 가까운 국가유산은 큰 아이콘
let watchId=null, listedAt=null;
function startGeo(){
  if(!navigator.geolocation){geoMsg="이 브라우저는 위치 기능을 지원하지 않아요."; if(mode==="me") render(); return;}
  geoMsg="내 위치를 찾는 중이에요…"; if(mode==="me") render();
  if(watchId!=null) navigator.geolocation.clearWatch(watchId);
  let first=true;
  watchId=navigator.geolocation.watchPosition(p=>{
    me={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};
    meLayer.clearLayers();
    const blue=cssv("--me");
    L.circle([me.lat,me.lng],{radius:me.acc,color:blue,weight:1,fillOpacity:.1,interactive:false}).addTo(meLayer);
    L.circleMarker([me.lat,me.lng],{radius:8,color:"#fff",weight:3,fillColor:blue,fillOpacity:1}).bindPopup("내 위치").addTo(meLayer);
    nearCheck(me);
    if(first){first=false; listedAt=me;
      if(wxFollow==="me") wxUpdate();
      if(mode==="me") showOnMap([me.lat,me.lng],16);
      findNearest(me).then(r=>{
        if(!r) return; if(mode==="me") render();
        // 가장 가까운 유산이 화면 밖이면 내 위치와 함께 보이게 (너무 멀면 내 위치 중심 그대로)
        if(mode==="me"&&r.h.d<15000&&!visibleBounds().contains([r.h.x.lat,r.h.x.lng])) fitTo(L.latLngBounds([[me.lat,me.lng],[r.h.x.lat,r.h.x.lng]]),16);
        drawKHS();});
      if(mode==="me"||mode==="trip"||(mode==="course"&&stage===2)){const k=pb.scrollTop; render(); pb.scrollTop=k;}}  // 길 화면이면 내 위치 출발 동선으로 다시
    else if(hav(listedAt.lat,listedAt.lng,me.lat,me.lng)>50){listedAt=me; findNearest(me).then(()=>drawKHS()); if(mode==="me"||mode==="food"||(mode==="course"&&stage===2)){const k=pb.scrollTop; render(); pb.scrollTop=k;}}
  },err=>{
    geoMsg=err.code===1?"위치 권한이 꺼져 있어요. 주소창의 사이트 설정에서 위치를 허용해 주세요.":"위치를 가져오지 못했어요. 잠시 후 다시 눌러 주세요.";
    if(mode==="me") render();
  },{enableHighAccuracy:true,maximumAge:10000,timeout:15000});
}

// ── 검색: 방문코스 유산 · 전국 국가유산 · 시·군·구는 이 사이트 안에서 바로 (이름만 깔끔하게),
// 동·역 같은 자세한 지명은 '지명 더 찾기'를 누를 때(또는 결과가 없을 때 Enter)만 OpenStreetMap에 물어본다
const qEl=$("q"), qres=$("qres");
let qItems=[], qSel=-1, qTimer=null, qPlaces=null;
const nz=s=>String(s||"").replace(/\s+/g,"").toLowerCase();
function qLocal(q){
  const n=nz(q); if(!n) return [];
  const score=name=>{const k=nz(name); return !k?9:k===n?0:k.startsWith(n)?1:k.includes(n)?2:9;};
  const seen=new Set(), spots=[];
  C.forEach(c=>c.spots.forEach(s=>{const sc=Math.min(score(s.name),score(s.address)+1); if(sc<9&&!seen.has(s.name)){seen.add(s.name); spots.push({t:"spot",sc,c,s});}}));
  const regions=(window.KHS_REGIONS||[]).map(r=>({t:"region",sc:Math.min(score(r[1]),score(r[0]+r[1])),r})).filter(x=>x.sc<9);
  const khs=(KHS||[]).map(h=>({t:"khs",sc:score(h.name),h})).filter(x=>x.sc<9&&!seen.has(x.h.name));
  const by=a=>a.sort((x,y)=>x.sc-y.sc);
  return [...by(regions).slice(0,3),...by(spots).slice(0,6),...by(khs).slice(0,8)];
}
const qMark=()=>qres.querySelectorAll("li[data-i]").forEach(li=>li.setAttribute("aria-selected",String(+li.dataset.i===qSel)));
const qName=x=>x.t==="spot"?x.s.name:x.t==="region"?`${x.r[0]} ${x.r[1]}`:x.t==="khs"?x.h.name:x.name;
function qRender(q){
  qItems=qLocal(q).concat(qPlaces||[]); qSel=qItems.length?0:-1;
  qres.innerHTML=qItems.map((x,i)=>`<li role="option" class="${x.t}" data-i="${i}">${x.t==="spot"||x.t==="khs"?I.roof.replace("<svg",'<svg width="20" height="20"'):x.t==="region"?I.area:I.pin}<span>${esc(qName(x))}</span></li>`).join("")+
    (qPlaces?(qPlaces.length?"":`<li class="empty">찾지 못했어요</li>`):`<li class="more" data-more>‘${esc(q)}’ 지명 더 찾기</li>`);
  qres.hidden=false; qMark();
  qres.querySelectorAll("li[data-i]").forEach(li=>li.onmousedown=e=>{e.preventDefault(); qChoose(qItems[+li.dataset.i]);});
  const more=qres.querySelector("[data-more]"); if(more) more.onmousedown=e=>{e.preventDefault(); qPlace(q);};
}
function qPlace(q){  // OpenStreetMap 지명 검색 (누를 때만, 대한민국 안)
  const more=qres.querySelector("[data-more]"); if(more) more.textContent="찾는 중…";
  fetch("https://nominatim.openstreetmap.org/search?"+new URLSearchParams({q,format:"jsonv2",countrycodes:"kr","accept-language":"ko",limit:"6"}))
    .then(r=>r.json()).then(a=>{
      qPlaces=a.map(p=>{const parts=p.display_name.split(", ").filter(x=>!/^\d{5}$|대한민국/.test(x));
        return {t:"place",name:parts[0]+(parts.length>2?` (${parts.slice(-2,-1)[0]})`:""),lat:+p.lat,lng:+p.lon,bb:p.boundingbox.map(Number)};});
      const n0=qLocal(q).length; qRender(q); if(qPlaces.length){qSel=n0; qMark();}})
    .catch(()=>{qPlaces=[]; qRender(q);});
}
function qChoose(x){
  if(!x) return; qres.hidden=true; qEl.blur(); searchLayer.clearLayers(); qEl.value=qName(x); $("qx").hidden=false;
  if(x.t==="spot") return openSpot(x.c.key,x.s.num);
  if(mobile()) setPanel("closed");
  if(x.t==="khs"){showOnMap([x.h.lat,x.h.lng],16);
    L.marker([x.h.lat,x.h.lng],{icon:khsIcon(true),title:x.h.name,zIndexOffset:600}).bindPopup(()=>khsPopup(x.h)).addTo(searchLayer).openPopup(); return;}
  // 지역(시·군·구) 또는 자세한 지명: 그 범위로, 유산 아이콘이 보이는 배율 이상
  const b=x.t==="region"?L.latLngBounds([x.r[4],x.r[5]],[x.r[6],x.r[7]]):L.latLngBounds([x.bb[0],x.bb[2]],[x.bb[1],x.bb[3]]);
  const c=x.t==="region"?[x.r[2],x.r[3]]:[x.lat,x.lng];
  fitTo(b,15); if(map.getZoom()<KHS_ZOOM) showOnMap(c,KHS_ZOOM);
  L.marker(c,{icon:L.divIcon({className:"",html:'<div class="qpin"></div>',iconSize:[18,18],iconAnchor:[9,9]}),title:qName(x)}).bindPopup(`<b>${esc(qName(x))}</b>`).addTo(searchLayer);
}
qEl.addEventListener("focus",()=>{loadKHS().then(()=>{if(qEl.value.trim()&&document.activeElement===qEl) qRender(qEl.value.trim());}).catch(()=>{});});
qEl.addEventListener("input",()=>{qPlaces=null; clearTimeout(qTimer); const q=qEl.value.trim(); $("qx").hidden=!qEl.value;
  if(!q){qres.hidden=true; return;} qTimer=setTimeout(()=>{qRender(q); if(!KHS) loadKHS().then(()=>{if(qEl.value.trim()===q) qRender(q);}).catch(()=>{});},120);});
qEl.addEventListener("keydown",e=>{
  if(e.isComposing) return;  // 한글 조합 중 Enter는 무시
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault(); if(qItems.length){qSel=(qSel+(e.key==="ArrowDown"?1:-1)+qItems.length)%qItems.length; qMark();}}
  else if(e.key==="Enter"){e.preventDefault(); const q=qEl.value.trim(); if(!q) return;
    clearTimeout(qTimer); if(qres.hidden) qRender(q);
    if(qSel>=0&&qItems.length) qChoose(qItems[qSel]); else if(qPlaces===null) qPlace(q);}
  else if(e.key==="Escape"){qres.hidden=true; qEl.blur();}
});
qEl.addEventListener("blur",()=>setTimeout(()=>{qres.hidden=true;},150));
$("qx").onclick=()=>{qEl.value=""; $("qx").hidden=true; qres.hidden=true; searchLayer.clearLayers(); qEl.focus();};

// ── 오늘 날씨: 내 위치 (다른 길을 고르면 그 길 지역) — MET Norway, 키 없음·CC BY 4.0
// 좌표는 소수 둘째 자리(약 1km)까지만 보내고, 같은 곳은 30분 동안 다시 묻지 않는다.
const WX_SYM=[["thunder","⚡","뇌우"],["snow","❄","눈"],["sleet","🌨","진눈깨비"],["heavyrain","☔","강한 비"],["rain","☂","비"],
  ["fog","🌫","안개"],["cloudy","☁","흐림"],["partlycloudy","⛅","구름 조금"],["fair","🌤","대체로 맑음"],["clearsky","☀","맑음"]];
const wxSym=c=>WX_SYM.find(([k])=>String(c||"").startsWith(k)||String(c||"").includes(k))||["","·","—"];
function wxPlace(){
  const c=cur&&C.find(x=>x.key===cur), sp=c&&spotNum&&c.spots.find(s=>s.num===spotNum);
  if(sp&&(wxFollow==="course"||!me)) return {lat:sp.lat,lng:sp.lng,name:sp.name.split(" (")[0]};  // 장소 카드를 보면 그 장소 날씨
  if(c&&(wxFollow==="course"||!me)){const b=L.latLngBounds(c.spots.map(s=>[s.lat,s.lng])).getCenter(); return {lat:b.lat,lng:b.lng,name:courseName(c)};}
  if(me) return {lat:me.lat,lng:me.lng,name:"내 위치"};
  return {lat:DAEJEON[0],lng:DAEJEON[1],name:"대전"};
}
let wxKey="", wxTimer=null;
const wxBtn=$("wx"), wxPop=$("wxPop");
wxBtn.onclick=()=>{const on=wxPop.hidden; wxPop.hidden=!on; wxBtn.setAttribute("aria-expanded",String(on));};
function wxUpdate(){clearTimeout(wxTimer); wxTimer=setTimeout(wxLoad,300); wxBtn.querySelector("small").textContent=wxPlace().name;}
async function wxLoad(){
  const p=wxPlace(), lat=p.lat.toFixed(2), lng=p.lng.toFixed(2), key=`${lat},${lng}`;
  if(key===wxKey&&wxBtn.dataset.ok) return;
  wxKey=key; let data=null;
  try{const c=JSON.parse(localStorage.getItem("hcm-wx-"+key)||"null"); if(c&&Date.now()-c.t<30*60e3) data=c.d;}catch(e){}
  if(!data){
    try{const r=await fetch(`https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=${lat}&lon=${lng}`); if(!r.ok) throw 0; data=await r.json();
      try{localStorage.setItem("hcm-wx-"+key,JSON.stringify({t:Date.now(),d:data}));}catch(e){}}
    catch(e){wxBtn.querySelector("b").textContent="--°"; return;}
  }
  if(key!==wxKey) return;  // 그사이 기준점이 바뀜
  const ts=data.properties.timeseries, now=Date.now();
  const i=Math.max(0,ts.findIndex(x=>new Date(x.time).getTime()>now-30*60e3)), t0=ts[i];
  const kst=d=>new Date(new Date(d).getTime()+9*3600e3).toISOString().slice(0,10), today=kst(now);
  const day=ts.filter(x=>kst(x.time)===today), temps=(day.length?day:ts.slice(0,24)).map(x=>x.data.instant.details.air_temperature);
  const rain=day.reduce((a,x)=>a+((x.data.next_1_hours||{}).details?.precipitation_amount||0),0);
  const sym=wxSym((t0.data.next_1_hours||t0.data.next_6_hours||{}).summary?.symbol_code), later=ts[i+3], lsym=later&&wxSym((later.data.next_1_hours||later.data.next_6_hours||{}).summary?.symbol_code);
  const t=Math.round(t0.data.instant.details.air_temperature);
  wxBtn.dataset.ok="1"; wxBtn.querySelector(".wx-i").textContent=sym[1]; wxBtn.querySelector("b").textContent=t+"°"; wxBtn.querySelector("small").textContent=p.name;
  wxBtn.setAttribute("aria-label",`오늘 날씨 ${p.name}: ${sym[2]} ${t}도`);
  wxPop.innerHTML=`<b>${esc(p.name)}</b> 지금 ${sym[1]} ${sym[2]} ${t}°<br>오늘 최고 ${Math.round(Math.max(...temps))}° · 최저 ${Math.round(Math.min(...temps))}° · 비 ${rain<0.1?"없음":rain.toFixed(1)+"mm"} · 바람 ${Math.round(t0.data.instant.details.wind_speed)}m/s${later?`<br>3시간 뒤 ${lsym[1]} ${Math.round(later.data.instant.details.air_temperature)}° ${lsym[2]}`:""}<br><small>자료: MET Norway</small>`;
}
