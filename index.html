<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; media-src https:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script>
/* 카카오톡·스레드·인스타그램 같은 앱 안 브라우저로 열리면 화면이 좁다 → 휴대폰 기본 브라우저로 내보낸다 */
(function(){
  var ua=navigator.userAgent||"", u=location.href;
  if(/KAKAOTALK/i.test(ua)){location.href="kakaotalk://web/openExternal?url="+encodeURIComponent(u);return;}
  if(!/Instagram|Barcelona|Threads|FBAN|FBAV|FB_IAB|Line\/|NAVER\(inapp|DaumApps|BAND\/|everytimeApp/i.test(ua)) return;
  if(/Android/i.test(ua)){  // 안드로이드: 크롬으로 (크롬이 없으면 그대로)
    location.href="intent://"+u.replace(/^https?:\/\//,"")+"#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url="+encodeURIComponent(u)+";end";return;}
  // 아이폰: 앱이 밖으로 못 내보내므로 위에 안내 띠
  document.addEventListener("DOMContentLoaded",function(){
    var d=document.createElement("div"); d.className="inapp";
    d.innerHTML='<span>앱 안 브라우저라 화면이 좁아요.</span><a href="x-safari-'+u.replace(/"/g,"%22")+'">Safari로 열기</a><button type="button" data-copy>주소 복사</button><button type="button" data-x aria-label="닫기">✕</button>';
    d.querySelector("[data-copy]").onclick=function(e){try{navigator.clipboard.writeText(u);e.target.textContent="복사됨";}catch(_){prompt("주소를 복사하세요",u);}};
    d.querySelector("[data-x]").onclick=function(){d.remove();};
    document.body.appendChild(d);
  });
})();
</script>
<title>국가유산 방문코스 지도</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw==" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 여권 스탬프 수첩 — 왼쪽(모바일은 아래) 종이 패널에 코스·유산 목록, 오른쪽(모바일은 위) 지도.
   색: 여행지도 PDF의 종이·먹·바다선 파랑. 인주색(--seal)은 '찍은 스탬프' 한 곳에만 쓴다. */
:root{
  --paper:#f4f3ee; --sheet:#fbfaf6; --ink:#1f2328; --muted:#5f655f; --rule:#d9d7cc;
  --sea:#2c5d82; --sea-soft:#e2ebf1; --seal:#c8372d; --food:#b35a17; --me:#1f6fd6;
  --ok:#1e7a46; --ok-soft:#dcefe3; --warn:#94590a; --warn-soft:#f8ead2; --kh:#6b5b95;
  --display:"Gowun Batang","Noto Serif KR",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#15181b; --sheet:#1c2024; --ink:#e9e8e2; --muted:#a2a79f; --rule:#343a3f;
  --sea:#7fb0d6; --sea-soft:#1e2c37; --seal:#ef6a5c; --food:#f08f4e; --me:#66a6ff;
  --ok:#82d3a2; --ok-soft:#1b3326; --warn:#f0bf6c; --warn-soft:#382c16; --kh:#b3a6dc; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#15181b; --sheet:#1c2024; --ink:#e9e8e2; --muted:#a2a79f; --rule:#343a3f;
  --sea:#7fb0d6; --sea-soft:#1e2c37; --seal:#ef6a5c; --food:#f08f4e; --me:#66a6ff;
  --ok:#82d3a2; --ok-soft:#1b3326; --warn:#f0bf6c; --warn-soft:#382c16; --kh:#b3a6dc; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.55 var(--body);word-break:keep-all;overflow-wrap:anywhere}
a{color:var(--sea)}
.app{display:grid;grid-template-columns:minmax(360px,430px) 1fr;height:100%}
aside{background:var(--sheet);border-right:1px solid var(--rule);display:flex;flex-direction:column;min-width:0;min-height:0}
.head{padding:14px max(16px,env(safe-area-inset-left,0px)) 10px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:10px}
h1{font:700 1.3rem/1.2 var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:12px;margin:2px 0 0}
.filters{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;align-self:flex-start}
.filters .btn{border:0;border-radius:0;background:transparent;padding:5px 12px}
.filters .btn+.btn{border-left:1px solid var(--rule)}
.filters .btn.on{background:var(--ink);color:var(--sheet)}
.grp{font-size:11px;color:var(--muted);margin:2px 0 6px;display:flex;align-items:baseline;gap:8px;letter-spacing:.02em}
.grp b{font-size:12px;font-weight:600;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:4px 10px;font:500 12px/1.4 var(--body);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.g2{border-radius:6px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.chip.g2 i{border-radius:2px}
.chip .part{font:600 10px/1 var(--body);border:1px solid currentColor;border-radius:3px;padding:1px 3px}
.chip .prog{font:500 10.5px/1 var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.chip[aria-pressed="true"] i{background:#fff}
.chip[aria-pressed="true"] .prog{color:#fff;opacity:.85}
.total{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:8px}
.total b{color:var(--seal);font-size:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:6px 11px;font:500 12.5px/1.3 var(--body);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px;min-height:32px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--me);border-color:var(--me);color:#fff}
.btn.on{background:var(--sea-soft);border-color:var(--sea);color:var(--ink)}
.chip:focus-visible,.btn:focus-visible,summary:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.gps{font-size:12px;color:var(--muted);flex-basis:100%}
.gps:empty{display:none}
.list{overflow:auto;padding:4px max(16px,env(safe-area-inset-left,0px)) 24px;display:flex;flex-direction:column;min-height:0}
.course-info{padding:12px 0 12px 14px;border-left:4px solid var(--c);margin:10px 0 4px;display:flex;flex-direction:column;gap:4px}
.list>.course-info[data-k]{cursor:pointer;margin:0;border-bottom:1px solid var(--rule)}
.list>.course-info[data-k]:hover{background:var(--paper)}
.course-info h2{font:700 1.08rem/1.3 var(--display);margin:0}
.course-info .meta{color:var(--muted);font-size:12.5px}
.bar{height:6px;border-radius:3px;background:var(--rule);overflow:hidden;margin-top:4px;max-width:240px}
.bar i{display:block;height:100%;background:var(--seal)}
.foods{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.foods span{font-size:11.5px;background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:0 6px}
.label{font-size:11px;letter-spacing:.06em;color:var(--muted);margin-top:6px}
.badge{display:inline-block;font:500 10.5px/1.6 var(--body);border:1px solid var(--rule);border-radius:4px;padding:0 5px;color:var(--muted);margin-left:6px;vertical-align:2px}
/* 유산 행: 상자 대신 괘선으로 구분 */
.spot{border-bottom:1px solid var(--rule);padding:12px 0;display:grid;grid-template-columns:34px 1fr;gap:3px 12px;cursor:pointer}
.spot.active{background:linear-gradient(90deg,var(--sea-soft),transparent 75%)}
.num{width:32px;height:26px;border-radius:13px;background:var(--c);color:#fff;font:600 12px/26px var(--body);text-align:center;font-variant-numeric:tabular-nums;position:relative}
.num.sq{border-radius:5px;font-size:10.5px}
.spot h3{font:700 15.5px/1.35 var(--display);margin:2px 0 0}
.line{grid-column:2;font-size:12.5px;color:var(--muted)}
.line b{color:var(--ink);font-weight:500}
.st{display:inline-block;font:600 11px/1.6 var(--body);border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:2px}
.st.open{background:var(--ok-soft);color:var(--ok)}
.st.soon{background:var(--warn-soft);color:var(--warn)}
.st.shut{background:var(--rule);color:var(--muted)}
.dist{font-variant-numeric:tabular-nums;color:var(--me);font-weight:600}
.spot .acts,.acts{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.stampBtn[aria-pressed="true"]{border-color:var(--seal);color:var(--seal);background:var(--sheet)}
/* 찍은 스탬프 = 인주 도장 (이 페이지의 단 하나의 강조) */
.spot.done .num,.pin.done{background:var(--sheet);color:var(--seal);box-shadow:inset 0 0 0 2px var(--seal);transform:rotate(-8deg)}
.pin.done{border-color:var(--seal)}
/* 찍은 유산 카드 오른쪽 위의 도장: 사이트 스탬프 그림(방문코스 1) 또는 이름 도장(방문코스 2) */
.spot{position:relative}
.spot.done>h3,.spot.done>.line,.spot.done>.acts{padding-right:100px}
.seal{position:absolute;top:6px;right:8px;width:80px;height:80px;border-radius:50%;box-shadow:0 0 0 2.5px var(--seal),inset 0 0 0 5px var(--sheet),inset 0 0 0 6.5px var(--seal);
  display:grid;place-items:center;overflow:hidden;transform:rotate(-12deg);pointer-events:none;background:var(--sheet);opacity:.92}
.seal img{width:82%;height:82%;object-fit:contain;filter:saturate(1.15)}
.seal span{font:700 13px/1.15 var(--display);color:var(--seal);text-align:center;padding:0 10px;word-break:keep-all}
.seal small{position:absolute;bottom:7px;left:0;right:0;text-align:center;font:600 8.5px/1 var(--body);color:var(--seal);letter-spacing:.04em}
.seal.myh{--r:-6deg;--o:1;width:96px;height:96px;top:2px;right:6px;box-shadow:none;background:none;border-radius:0;overflow:visible;opacity:1;transform:rotate(-6deg);display:block}
.seal.myh .frame{width:100%;height:100%;object-fit:contain;filter:none;display:block}
.seal.myh b{position:absolute;left:15%;right:15%;top:51%;height:31%;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;text-align:center;font:700 10.5px/1.12 var(--body);color:#131416;word-break:keep-all;overflow-wrap:anywhere;letter-spacing:-.03em}
.seal.myh b i{display:block;font-weight:600;font-size:.72em;line-height:1.2;font-style:normal;margin-bottom:1px;white-space:nowrap}
.seal.myh .cert{position:absolute;top:-6px;right:-10px;width:36px;height:36px;transform:rotate(-10deg)}
.seal.myh.thud .cert{animation:thud2 .45s .32s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes thud2{0%{transform:scale(2.6) rotate(20deg);opacity:0}60%{transform:scale(.9) rotate(-10deg);opacity:1}100%{transform:scale(1) rotate(-10deg)}}
.seal.thud{animation:thud .5s cubic-bezier(.2,.9,.3,1.25) both}
.spot.thudcard{animation:shake .35s .28s ease-out}
@keyframes thud{0%{transform:scale(2.8) rotate(-30deg);opacity:0}55%{transform:scale(.88) rotate(var(--r,-12deg));opacity:1}75%{transform:scale(1.04) rotate(var(--r,-12deg))}100%{transform:scale(1) rotate(var(--r,-12deg));opacity:var(--o,.92)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translate(1px,2px)}50%{transform:translate(-1px,-1px)}75%{transform:translate(1px,0)}}
@media (prefers-reduced-motion:reduce){.seal.thud .cert,.seal.thud,.spot.thudcard{animation:none}}
details{grid-column:2;font-size:12.5px;margin-top:4px}
summary{cursor:pointer;color:var(--sea);padding:2px 0}
.rest{list-style:none;margin:6px 0 2px;padding:0;display:flex;flex-direction:column;gap:2px}
.rest li{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;padding:3px 0;border-bottom:1px dotted var(--rule)}
.rest li:hover{color:var(--food)}
.rest li img{width:36px;height:36px;object-fit:cover;border-radius:4px;flex:none;background:var(--rule)}
.rest li span{flex:1;min-width:0}
.rest small{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.spot dl{margin:6px 0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px}
.spot dt{color:var(--muted)} .spot dd{margin:0;min-width:0;user-select:text}
.photo{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;margin-top:6px;background:var(--rule);display:block}
.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:4px}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;background:var(--rule)}
.desc{margin:8px 0;line-height:1.75;max-height:12.5em;overflow:auto;max-width:62ch}
.ev{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.ev li{display:flex;flex-direction:column}
.ev small{color:var(--muted)}
.ev a{color:var(--ink);font-weight:500}
#map{height:100%;min-height:0;background:var(--sea-soft)}
.pin{width:32px;height:26px;border-radius:13px;background:var(--c);color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);font:600 11px/22px var(--body);text-align:center;font-variant-numeric:tabular-nums}
.pin.sq{border-radius:5px;font-size:10px}
.fpin{width:12px;height:12px;border-radius:50%;background:var(--food);border:2px solid #fff;box-shadow:0 0 2px rgba(0,0,0,.4)}
.legend{background:var(--sheet);color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:6px 10px;font:12px/1.7 var(--body);display:flex;flex-wrap:wrap;gap:4px 12px;max-width:min(92vw,520px)}
.viewinfo{background:var(--sheet);color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:4px 9px;font:12px/1.5 var(--body);max-width:min(70vw,300px)}
.viewinfo:empty{display:none}
.viewinfo b{color:var(--kh)}
.gps b{color:var(--ink)}
.gps .lk{color:var(--sea);text-decoration:underline;cursor:pointer;background:none;border:0;padding:0;font:inherit}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:16px;height:12px;background:var(--muted)}
.leaflet-popup-content{font:13px/1.55 var(--body);word-break:keep-all}
.leaflet-popup-content b{font-family:var(--display);font-size:14px}
.player{display:flex;align-items:center;gap:8px;padding:8px max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--rule);background:var(--sea-soft);font-size:12.5px}
.player audio{flex:1;min-width:0;height:32px}
.player b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.src{font-size:11px;line-height:1.6;color:var(--muted);padding:8px max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--rule)}
.src a{color:var(--muted)}
.grab{display:none}
.inapp{position:fixed;left:8px;right:8px;top:max(8px,env(safe-area-inset-top,0px));z-index:3000;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:var(--ink);color:var(--sheet);border-radius:10px;padding:8px 10px;font:500 12.5px/1.4 var(--body);box-shadow:0 4px 16px rgb(0 0 0 / .25)}
.inapp span{flex:1 1 140px}
.inapp a,.inapp button{color:var(--sheet);background:none;border:1px solid currentColor;border-radius:6px;padding:3px 8px;font:inherit;text-decoration:none;cursor:pointer}
.inapp [data-x]{border:0;padding:3px 4px}
.crow .grp span{font-size:11px}
.btn.ico svg{flex:none}
.legend small{font-size:inherit;color:var(--muted)}
.viewinfo small{color:var(--muted)}
/* 모바일: 지도는 화면 가득, 목록은 아래에서 끌어 올리는 시트(작게·반·크게) — 시트 안은 한 번에 스크롤 */
@media (max-width:820px){
  html,body{overflow:hidden}
  .app{display:block;height:100%}
  #map{position:fixed;inset:0}
  aside{position:fixed;left:0;right:0;bottom:0;z-index:1001;height:50dvh;max-height:calc(100dvh - 48px);border:0;border-top:1px solid var(--rule);
    border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgb(0 0 0 / .18);overflow-y:auto;overscroll-behavior:contain;transition:height .28s cubic-bezier(.2,.8,.2,1)}
  aside.dragging{transition:none}
  .list{overflow:visible;min-height:auto}
  .grab{display:block;position:sticky;top:0;z-index:3;width:100%;height:26px;border:0;padding:0;margin:0 0 -8px;background:var(--sheet);cursor:grab;touch-action:none}
  .grab::before{content:"";display:block;width:42px;height:5px;border-radius:3px;background:var(--muted);opacity:.45;margin:9px auto 0}
  .head h1{touch-action:none}
  .player{position:sticky;bottom:0;z-index:2}
  .leaflet-bottom{bottom:var(--sheet-vis,50dvh);transition:bottom .28s}
  /* 고정 머리: 제목 · 아이콘 버튼 · 코스 묶음을 한 줄로 */
  .head{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 6px;padding-top:6px;padding-bottom:8px}
  .head h1{font-size:15.5px;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .head .lg{display:none}
  .tools{display:contents}
  .btn.ico{width:34px;height:34px;min-height:34px;padding:0;justify-content:center;border-radius:50%}
  .filters{align-self:center}
  .filters .btn{min-height:34px;padding:4px 10px}
  .gps{order:10;flex-basis:100%;font-size:11.5px;line-height:1.45}
  #chips{order:11;flex-basis:100%;min-width:0}
  .crow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .crow .grp{margin:0;flex:none}
  .crow .grp span{display:none}
  .crow .chips{flex:1;min-width:0}
  .chip{padding:3px 9px}
  .total{margin-top:2px;font-size:11.5px}
  .legend small{display:none}
  .viewinfo{font-size:11.5px;padding:3px 8px}
  .sub{display:none}
  /* 코스 칩은 한 줄 가로 스크롤 */
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .chips::-webkit-scrollbar{display:none}
  .btn{min-height:36px}
  .src{display:none}
  .legend{font-size:10.5px;padding:3px 7px;gap:2px 8px;line-height:1.5}
  .legend i{width:12px;height:9px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <button class="grab" id="grab" type="button" aria-label="목록 높이 바꾸기 (끌거나 누르기)" aria-expanded="true"></button>
    <div class="head">
      <h1>국가유산 방문코스<span class="lg"> 지도</span></h1>
      <p class="sub">2026 방문 캠페인 · 방문코스 1(10개 길, 소릿길·왕가의 길은 1·2구간) + 방문코스 2(3개 길) · 105곳</p>
      <div class="tools">

  </aside>
  <div id="map"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="data.js"></script>
<script>
// 코스 색: 1/2구간으로 나뉜 길은 같은 계열의 진한색(1)/밝은색(2), 선 모양도 다르게
const COLOR={"1":"#a0522d","2":"#2f7fb0","3":"#7a4fa3","4":"#2e8b57","5":"#5f6b78","6":"#8d7b5a",
  "7":"#c0392b","8-1":"#c27a00","8-2":"#e0a93a","9-1":"#8a4d12","9-2":"#c58a3d","10":"#8e44ad",
  "11":"#1f4e9c","12":"#e0622a","13":"#3d6b4f"};
const C=window.COURSES;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// 링크·이미지 주소는 http(s)와 이 사이트의 stamps/ 그림만 (javascript: 같은 주소는 막음)
const url=u=>/^(https?:\/\/|stamps\/)/i.test(String(u||""))?esc(u):"#";
const km=m=>m<1000?`${Math.round(m)}m`:`${(m/1000).toFixed(m<10000?1:0)}km`;
function hav(a,b,c,d){const R=6371000,t=Math.PI/180,x=Math.sin((c-a)*t/2)**2+Math.cos(a*t)*Math.cos(c*t)*Math.sin((d-b)*t/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
const partOf=c=>(c.key.match(/-(\d)$/)||[])[1];          // "8-2" → "2"
const dashOf=c=>c.group===2?"2 6":partOf(c)==="2"?"14 6":"6 6";

const map=L.map("map").setView([36.3,127.8],7);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}).addTo(map);
map.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');
map.createPane("food").style.zIndex=550;  // 맛집 점은 유산 번호 핀(markerPane 600) 아래에
const spotLayer=L.layerGroup().addTo(map), foodLayer=L.layerGroup().addTo(map), meLayer=L.layerGroup().addTo(map), nearLayer=L.layerGroup().addTo(map);
const legend=L.control({position:"bottomleft"});
legend.onAdd=()=>{const d=L.DomUtil.create("div","legend");
  d.innerHTML='<span><i style="border-radius:6px"></i>코스 1<small> (01~98)</small></span><span><i style="border-radius:2px"></i>코스 2<small> (001~024)</small></span><span><i style="width:10px;height:10px;border-radius:50%;background:var(--food)"></i>맛집</span><span><i style="width:9px;height:9px;border-radius:50%;background:var(--kh)"></i>국가유산<small> (확대 시)</small></span>';return d};
legend.addTo(map);
let cur="", filter="all", showFood=true, me=null, markers={};

// 전국 국가유산 1.2만 곳 (heritage_all.js, 1MB라 처음 필요할 때 불러온다)
let KHS=null, khsLoading=null;
function loadKHS(){
  if(KHS) return Promise.resolve(KHS);
  return khsLoading||(khsLoading=new Promise((ok,no)=>{const s=document.createElement("script"); s.src="heritage_all.js";
    s.onload=()=>{KHS=window.KHS_ALL.map(r=>({name:r[0],kind:window.KHS_KINDS[r[1]]||"",lat:r[2],lng:r[3],code:r[4]})); ok(KHS);};
    s.onerror=()=>{khsLoading=null; no();}; document.head.appendChild(s);}));
}
const myhUrl=h=>{const[kd,asno,ctcd,cpno]=h.code.split("|");return `https://my.heritage.go.kr/public/commentary/culSelectDetail.do?ccbaKdcd=${kd}&ccbaAsno=${asno}&ccbaCtcd=${ctcd}&ccbaCpno=${cpno}`};
const khsPopup=h=>`<b>${esc(h.name)}</b><br>${esc(h.kind)}${me?` · 내 위치에서 ${km(hav(me.lat,me.lng,h.lat,h.lng))}`:""}<br><a href="${myhUrl(h)}" target="_blank" rel="noopener">국가유산 해설사에서 보기</a> · <a href="${kakaoTo(h)}" target="_blank" rel="noopener">길찾기</a>`;
const khsRenderer=L.canvas({padding:.3}), khsLayer=L.layerGroup().addTo(map), nearestLayer=L.layerGroup().addTo(map);
const KHS_ZOOM=11, KHS_MAX=400;  // 시·군 단위로 확대했을 때만, 화면 가운데에서 가까운 400곳까지
const viewInfo=L.control({position:"topright"}); viewInfo.onAdd=()=>L.DomUtil.create("div","viewinfo"); viewInfo.addTo(map);
// 지도 화면(확대·이동)에 맞춰 그 안의 국가유산을 점으로 표시
function drawKHS(){
  const box=viewInfo.getContainer(), b=map.getBounds();
  const courseIn=new Set(C.flatMap(c=>c.spots).filter(s=>b.contains([s.lat,s.lng])).map(s=>s.name)).size;
  if(map.getZoom()<KHS_ZOOM){khsLayer.clearLayers(); box.innerHTML=`방문코스 <b>${courseIn}</b>곳 · 확대하면 국가유산 점`; return;}
  loadKHS().then(all=>{
    if(map.getZoom()<KHS_ZOOM) return;
    const c=map.getCenter(), inView=all.filter(h=>b.contains([h.lat,h.lng]));
    inView.forEach(h=>h._c=hav(c.lat,c.lng,h.lat,h.lng)); inView.sort((x,y)=>x._c-y._c);
    const kh=getComputedStyle(document.documentElement).getPropertyValue("--kh").trim();
    khsLayer.clearLayers();
    inView.slice(0,KHS_MAX).forEach(h=>L.circleMarker([h.lat,h.lng],{renderer:khsRenderer,radius:5,color:"#fff",weight:1.5,fillColor:kh,fillOpacity:.9}).bindPopup(()=>khsPopup(h)).addTo(khsLayer));
    box.innerHTML=`국가유산 <b>${inView.length}</b>곳${inView.length>KHS_MAX?`<small> (가까운 ${KHS_MAX}곳만)</small>`:""} · 방문코스 ${courseIn}곳`;
  }).catch(()=>{box.textContent="국가유산 목록을 불러오지 못했어요.";});
}
let khsTimer=null; map.on("moveend",()=>{clearTimeout(khsTimer); khsTimer=setTimeout(drawKHS,150);});
// 내 위치와 가장 가까운 국가유산이 함께 보이게 (국가유산 점이 보이는 배율 이상)
function fitNear(pt,h){
  map.stop(); const b=L.latLngBounds([[pt.lat,pt.lng],[h.x.lat,h.x.lng]]);
  map.fitBounds(b,{paddingTopLeft:[50,50],paddingBottomRight:[50,padB(20)],maxZoom:15,animate:false}); if(map.getZoom()<KHS_ZOOM) map.setView(b.getCenter(),KHS_ZOOM,{animate:false});
  setTimeout(()=>h.marker.openPopup(),300);
}
// 기준점(내 위치 또는 지도 가운데)에서 가장 가까운 국가유산·방문코스 유산
function findNearest(pt,label){
  const msg=document.getElementById("gpsMsg");
  return loadKHS().then(all=>{
    let h=null; all.forEach(x=>{const d=hav(pt.lat,pt.lng,x.lat,x.lng); if(!h||d<h.d) h={d,x};});
    let s=null; C.forEach(c=>c.spots.forEach(y=>{const d=hav(pt.lat,pt.lng,y.lat,y.lng); if(!s||d<s.d) s={d,c,s:y};}));
    nearestLayer.clearLayers();
    const kh=getComputedStyle(document.documentElement).getPropertyValue("--kh").trim();
    const m=L.circleMarker([h.x.lat,h.x.lng],{radius:11,color:kh,weight:3,fillColor:"#fff",fillOpacity:.6}).bindPopup(()=>"<small>가장 가까운 국가유산</small><br>"+khsPopup(h.x)).addTo(nearestLayer);
    msg.innerHTML=`${label} 가장 가까운 국가유산: <button class="lk" type="button" id="nearKhs">${esc(h.x.name)}</button> (${esc(h.x.kind)}, ${km(h.d)})<br>가장 가까운 방문코스 유산: <button class="lk" type="button" id="nearSpot">${esc(s.s.name)}</button> (${esc(s.c.title)}, ${km(s.d)})`;
    document.getElementById("nearKhs").onclick=()=>{showOnMap([h.x.lat,h.x.lng],Math.max(map.getZoom(),15)); m.openPopup();};
    document.getElementById("nearSpot").onclick=()=>{if(cur!==s.c.key) select(s.c.key); const mk=markers[s.c.key+"|"+s.s.num]; showOnMap([s.s.lat,s.s.lng],15); if(mk) mk.openPopup(); focusCard(s.c.key,s.s.num,false);};
    h.marker=m; return {s,h};
  }).catch(()=>{msg.textContent="국가유산 목록을 불러오지 못했어요. 잠시 후 다시 눌러 주세요.";});
}

const pinIcon=(label,c,g)=>L.divIcon({className:"",html:`<div class="pin${g===2?" sq":""}${stamps.has(label)?" done":""}" style="--c:${c}">${label}</div>`,iconSize:[30,26],iconAnchor:[15,13],popupAnchor:[0,-13]});
const foodIcon=L.divIcon({className:"",html:'<div class="fpin"></div>',iconSize:[12,12],iconAnchor:[6,6]});
const kakaoTo=s=>`https://map.kakao.com/link/to/${encodeURIComponent(s.name)},${s.lat},${s.lng}`;
const naverFood=s=>`https://map.naver.com/p/search/${encodeURIComponent(s.name.replace(/\s*\(.*\)/,"")+" 맛집")}`;
const visible=()=>C.filter(c=>filter==="all"||String(c.group)===filter);
const kind=f=>({restaurant:"음식점",cafe:"카페",fast_food:"패스트푸드"}[f.kind]||"")+(f.cuisine?` · ${f.cuisine.replace(/;/g,", ")}`:"")+(f.src==="tour"?" · 관광공사":"");
const shortTitle=c=>c.title.replace(/ [12]$/,"");

// 스탬프 체크: 이 브라우저에만 저장. 같은 번호(예: 83 종묘)는 왕가의 길 1·2에서 함께 체크된다
let stamps=new Set();
try{stamps=new Set(JSON.parse(localStorage.getItem("hcm-stamps")||"[]"))}catch(e){}
const saveStamps=()=>{try{localStorage.setItem("hcm-stamps",JSON.stringify([...stamps]))}catch(e){}};
const done=c=>c.spots.filter(s=>stamps.has(s.num)).length;
const allNums=[...new Set(C.flatMap(c=>c.spots.map(s=>s.num)))];

// 오늘 운영 상태 (스탬프 이용 가능 시간 기준, 공휴일은 반영 안 함)
const toMin=t=>{const[h,m]=t.split(":").map(Number);return h*60+m};
function status(s,now=new Date()){
  const h=s.sched; if(!h) return null;
  if(h.always) return {cls:"open",text:"상시 가능"};
  const dow=now.getDay(), mon=now.getMonth()+1, date=now.getDate();
  let closed=(h.closed||[]).includes(dow);
  if(closed&&h.openOnMarketDay&&(date%10===2||date%10===7)) closed=false;
  if(h.closedFirstWed&&dow===3&&date<=7) closed=true;
  if((h.closedFirst||[]).includes(dow)&&date<=7) closed=true; // 매월 첫째 ○요일
  if(closed) return {cls:"shut",text:"오늘 휴무"};
  const p=(h.periods||[]).find(p=>!p.months||p.months.includes(mon)); if(!p) return null;
  const [o,c]=(h.byDay&&h.byDay[dow])||[p.open,p.close];
  const t=now.getHours()*60+now.getMinutes();
  if(t<toMin(o)) return {cls:"shut",text:`${o} 열림`};
  if(t>=toMin(c)) return {cls:"shut",text:"오늘 운영 끝"};
  if(toMin(c)-t<=60) return {cls:"soon",text:`곧 마감 ${c}`};
  return {cls:"open",text:`운영 중 ~${c}`};
}
const CERT_IMG="https://my.heritage.go.kr/images/2025/contents/stamp/cert.svg";  // 해설사 방문 인증의 '인증완료' 배지
// 도장: ① 나만의 국가유산 해설사 분류 스탬프 ② 캠페인 사이트 스탬프 그림 ③ 이름 도장 (못 불러오면 이름 도장)
const sealName=s=>esc(s.name.replace(/\s*\(.*\)$/,"").replace(/ 천연보호구역$/,""));
function sealFail(img){const d=img.parentNode, sp=document.createElement("span"); sp.textContent=d.dataset.name; d.className="seal"+(d.classList.contains("thud")?" thud":""); d.replaceChildren(sp);}  // 그림을 못 불러오면 이름 도장으로
const sealHTML=s=>{const fb="sealFail(this)";
  // 해설사 '방문 인증' 화면의 도장: 분류 그림 + 지정 종목 + 이름 + 인증완료 배지
  if(s.myhStamp) return `<div class="seal myh" aria-hidden="true" data-name="${sealName(s)}" title="${esc(s.myhStamp.cat)} 스탬프 · 인증완료"><img class="frame" src="${url(s.myhStamp.img)}" alt="" onerror="${fb}"><b><i>${esc(s.myhStamp.kind)}</i>${sealName(s)}</b><img class="cert" src="${CERT_IMG}" alt="" onerror="this.remove()"></div>`;
  return `<div class="seal" aria-hidden="true" data-name="${sealName(s)}">${s.stampImg?`<img src="${url(s.stampImg)}" alt="" onerror="${fb}">`:`<span>${sealName(s)}</span>`}<small>${s.stampImg?"":"STAMP"}</small></div>`;};
// 도장 글자를 도장 그림 안 글자 칸에 맞춰 줄인다 (10.5px → 최소 5.5px)
function fitSeals(root){
  root.querySelectorAll(".seal.myh b").forEach(b=>{
    let f=10.5; b.style.fontSize=f+"px";
    while(f>5.5&&(b.scrollHeight>b.clientHeight+1||b.scrollWidth>b.clientWidth+1)){f-=.5; b.style.fontSize=f+"px";}
  });
}
const stBadge=s=>{const x=status(s);return x?`<span class="st ${x.cls}">${x.text}</span>`:""};

function chips(){
  document.querySelectorAll(".filters .btn").forEach(b=>b.classList.toggle("on",b.dataset.f===filter));
  const row=g=>`<div class="crow"><div class="grp"><b>방문코스 ${g}</b><span>${g===1?"사이트 크롤링 · 여행지도 번호":"여행지도 PDF · 스탬프 위치 공지"}</span></div><div class="chips">`+
    C.filter(c=>c.group===g).map(c=>`<button class="chip${g===2?" g2":""}" type="button" style="--c:${COLOR[c.key]}" data-k="${c.key}" aria-label="${esc(c.title)}" aria-pressed="${cur===c.key}"><i></i>${esc(shortTitle(c))}${partOf(c)?` <span class="part">${partOf(c)}</span>`:""} <span class="prog">${done(c)}/${c.spots.length}</span></button>`).join("")+"</div></div>";
  const got=allNums.filter(n=>stamps.has(n)).length;
  document.getElementById("chips").innerHTML=(filter!=="2"?row(1):"")+(filter!=="1"?row(2):"")+
    `<div class="total">내 스탬프 <b>${got}</b> / ${allNums.length}곳</div>`;
  document.querySelectorAll("#chips .chip").forEach(b=>b.onclick=()=>select(cur===b.dataset.k?"":b.dataset.k));
  const on=document.querySelector('#chips .chip[aria-pressed="true"]'); if(on) on.scrollIntoView({block:"nearest",inline:"center"});
}

function popupHtml(c,s){
  return `<b>${esc(s.num)}. ${esc(s.name)}</b>${stBadge(s)}${stamps.has(s.num)?" ✓":""}<br><span>${esc(c.title)} · 방문코스 ${c.group}${s.designation?` · ${esc(s.designation)}`:""}</span><br>
  ${s.address?`위치: ${esc(s.address)}<br>`:""}${s.phone?`문의: ${esc(s.phone)}<br>`:""}${s.stamp?`스탬프: ${esc(s.stamp)}<br>`:""}${s.hours?`운영: ${esc(s.hours)}<br>`:""}
  ${s.geo==="approx"?"<em>※ 대략 위치</em><br>":""}
  <a href="${kakaoTo(s)}" target="_blank" rel="noopener">카카오맵 길찾기</a> · <a href="${naverFood(s)}" target="_blank" rel="noopener">네이버 주변 맛집</a>`;
}

function draw(noFit){
  spotLayer.clearLayers(); foodLayer.clearLayers(); nearLayer.clearLayers(); markers={};
  const list=cur?C.filter(c=>c.key===cur):visible(), pts=[];
  list.forEach(c=>{
    const col=COLOR[c.key];
    L.polyline(c.spots.map(s=>[s.lat,s.lng]),{color:col,weight:cur?3:2,opacity:cur?.75:.4,dashArray:dashOf(c)}).addTo(spotLayer);
    c.spots.forEach(s=>{
      const m=L.marker([s.lat,s.lng],{icon:pinIcon(s.num,col,c.group),title:`${s.num} ${s.name}`}).bindPopup(popupHtml(c,s)).addTo(spotLayer);
      m.on("click",()=>focusCard(c.key,s.num));
      markers[`${c.key}|${s.num}`]=m; pts.push([s.lat,s.lng]);
      if(cur&&showFood) s.restaurants.forEach(f=>L.marker([f.lat,f.lng],{icon:foodIcon,title:f.name,pane:"food"})
        .bindPopup(`<b>${esc(f.name)}</b><br>${esc(kind(f))}<br>${esc(s.name)}에서 ${km(f.dist)}${f.addr?`<br>${esc(f.addr)}`:""}${(f.phone||f.tel)?`<br>전화: ${esc(f.phone||f.tel)}`:""}${f.photo?`<br><img src="${url(f.photo)}" alt="" style="width:160px;border-radius:6px;margin-top:4px">`:""}`).addTo(foodLayer));
    });
  });
  if(pts.length&&!noFit) map.fitBounds(pts,{paddingTopLeft:[30,30],paddingBottomRight:[30,padB()],maxZoom:13});
}

function list(){
  const el=document.getElementById("list");
  if(!cur){
    el.innerHTML=visible().map(c=>`<div class="course-info" style="--c:${COLOR[c.key]};cursor:pointer" data-k="${c.key}">
      <h2>${esc(c.title)}<span class="badge">방문코스 ${c.group}</span><span class="badge">스탬프 ${done(c)}/${c.spots.length}</span></h2>
      ${c.theme?`<div class="meta">${esc(c.theme)}</div>`:""}
      <div class="meta">${c.spots.length}곳: ${c.spots.map(s=>esc(s.name.split(" (")[0])).join(", ")}</div></div>`).join("");
    el.querySelectorAll(".course-info").forEach(d=>d.onclick=()=>select(d.dataset.k));
    return;
  }
  const c=C.find(x=>x.key===cur), col=COLOR[c.key];
  const spots=c.spots.map(s=>({...s}));
  if(me) spots.forEach(s=>s.d=hav(me.lat,me.lng,s.lat,s.lng)), spots.sort((a,b)=>a.d-b.d);
  el.innerHTML=`<div class="course-info" style="--c:${col}"><h2>${esc(c.title)}<span class="badge">방문코스 ${c.group}</span><span class="badge">스탬프 ${done(c)}/${c.spots.length}</span></h2>
    <div class="bar" aria-hidden="true"><i style="width:${Math.round(100*done(c)/c.spots.length)}%"></i></div>
    ${c.theme?`<div class="meta">${esc(c.theme)}</div>`:""}${c.regions?`<div class="meta">${esc(c.regions)}</div>`:""}
    ${c.parent?`<div class="meta">사이트의 「${esc(c.parent)}」을 2026 여행지도 기준 ${partOf(c)}구간으로 나눔</div>`:""}
    ${c.foods.length?`<div class="label">지역 먹거리</div><div class="foods">${c.foods.map(f=>`<span title="${esc(f.desc)}">${esc(f.name)}</span>`).join("")}</div>`:""}
    ${me?`<div class="label">내 위치에서 가까운 순</div>`:""}</div>`+
  // 카드 기본 3줄: ① 번호·이름·오늘 상태 ② 스탬프 장소·거리 ③ 스탬프 체크·길찾기 — 나머지는 펼치기
  spots.map(s=>`<article class="spot${stamps.has(s.num)?" done":""}" style="--c:${col}" id="card-${c.key}-${s.num}" data-k="${c.key}|${s.num}">
    <div class="num${c.group===2?" sq":""}">${esc(s.num)}</div>
    ${stamps.has(s.num)?sealHTML(s):""}
    <h3>${esc(s.name)}${stBadge(s)}</h3>
    <div class="line">스탬프 <b>${esc(s.stamp||"현장 안내 확인")}</b>${s.d!=null?` · <span class="dist">${km(s.d)}</span>`:""}</div>
    <div class="acts"><button class="btn stampBtn" type="button" data-n="${esc(s.num)}" aria-pressed="${stamps.has(s.num)}">${stamps.has(s.num)?"✓ 스탬프 찍음":"스탬프 찍었어요"}</button>
      <a class="btn" href="${kakaoTo(s)}" target="_blank" rel="noopener">길찾기</a>
      ${s.myh?`<button class="btn audioBtn" type="button" data-a="${url(s.myh.audio.kr)}" data-t="${esc(s.name)}">▶ 음성 해설</button>`:""}</div>
    <details ${s.restaurants.length?"":"hidden"}><summary>주변 맛집 ${s.restaurants.length}곳</summary><ul class="rest">
      ${s.restaurants.map(f=>`<li data-lat="${f.lat}" data-lng="${f.lng}">${f.photo?`<img src="${url(f.photo)}" alt="" loading="lazy" onerror="this.remove()">`:""}<span>${esc(f.name)} <small>${esc(kind(f))}</small></span><small>${km(f.dist)}</small></li>`).join("")}</ul></details>
    <details ${s.nearby.length?"":"hidden"}><summary>주변 볼거리 ${s.nearby.length}곳 (1.5km 안 국가유산)</summary><ul class="rest near">
      ${s.nearby.map(n=>`<li data-lat="${n.lat}" data-lng="${n.lng}" data-name="${esc(n.name)}" data-url="${url(n.url)}"><span>${esc(n.name)} <small>${esc(n.kind)}</small></span><small>${km(n.dist)}</small></li>`).join("")}</ul></details>
    ${s.myh&&s.myh.events.length?`<details><summary>지역 행사 ${s.myh.events.length}건</summary><ul class="ev">
      ${s.myh.events.map(e=>`<li><a href="${url(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a><small>${esc(e.cat)}${e.when?` · ${esc(e.when)}`:""}${e.where?` · ${esc(e.where)}`:""}</small></li>`).join("")}</ul></details>`:""}
    ${!s.myh&&s.campPhoto?`<details class="guide"><summary>사진</summary><img class="photo" src="${url(s.campPhoto)}" alt="${esc(s.name)} — 방문 캠페인 사진" loading="lazy" onerror="this.remove()"></details>`:""}
    ${s.myh?`<details class="guide"><summary>사진·해설</summary>
      ${s.campPhoto?`<img class="photo" src="${url(s.campPhoto)}" alt="${esc(s.name)} — 방문 캠페인 사진" loading="lazy" onerror="this.remove()">`:s.myh.photo?`<img class="photo" src="${url(s.myh.photo)}" alt="${esc(s.name)}" loading="lazy">`:""}
      ${s.myh.photos.length>(s.campPhoto?0:1)?`<div class="thumbs">${s.myh.photos.slice(s.campPhoto?0:1,6).map(p=>`<img src="${url(p.src)}" alt="${esc(p.alt)}" title="${esc(p.alt)}" loading="lazy">`).join("")}</div>`:""}
      ${s.myh.khsName&&s.myh.khsName!==s.name?`<div class="line" style="margin-top:6px">해설 기준: ${esc(s.myh.khsName)}</div>`:""}
      <p class="desc">${esc(s.myh.desc).replace(/\n/g,"<br>")}</p>
      <div class="acts" style="margin:0"><button class="btn audioBtn" type="button" data-a="${url(s.myh.audio.en)}" data-t="${esc(s.name)} (English)">▶ English audio</button>
        ${s.myh.video.map((v,i)=>`<a class="btn" href="${url(v)}" target="_blank" rel="noopener">동영상${s.myh.video.length>1?" "+(i+1):""}</a>`).join("")}
        <a class="btn" href="${url(s.myh.url)}" target="_blank" rel="noopener">국가유산 해설사에서 보기</a></div></details>`:""}
    <details><summary>자세히</summary>
      <dl>${s.tagline||s.designation?`<dt>소개</dt><dd>${[s.tagline,s.designation].filter(Boolean).map(esc).join(" · ")}</dd>`:""}${s.address?`<dt>위치</dt><dd>${esc(s.address)}</dd>`:""}${s.phone?`<dt>문의</dt><dd>${esc(s.phone)}</dd>`:""}${s.hours?`<dt>운영</dt><dd>${esc(s.hours)}${s.sched&&s.sched.note?` (${esc(s.sched.note)})`:""}</dd>`:""}
        ${s.directions?`<dt>가는 길</dt><dd>${esc(s.directions)}</dd>`:""}
        ${s.myh?Object.entries(s.myh.meta||{}).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join(""):""}
        <dt>GPS</dt><dd style="font-variant-numeric:tabular-nums">${s.lat.toFixed(5)}, ${s.lng.toFixed(5)}${s.geo==="approx"?" (대략)":""}</dd>
        <dt>출처</dt><dd>${s.src==="site"?"코스 사이트":"여행지도 PDF·스탬프 공지"}</dd></dl>
      <a class="btn" href="${naverFood(s)}" target="_blank" rel="noopener">네이버 지도에서 맛집 더 보기</a></details>
  </article>`).join("");
  fitSeals(el);
  el.querySelectorAll(".stampBtn").forEach(b=>b.onclick=e=>{
    e.stopPropagation(); const n=b.dataset.n;
    const add=!stamps.has(n), card=b.closest(".spot").id;
    add?stamps.add(n):stamps.delete(n); saveStamps();
    const open=[...el.querySelectorAll("details[open]")].map(d=>d.closest(".spot").id+"|"+[...d.parentNode.children].indexOf(d));
    chips(); refreshPins(); list();
    open.forEach(k=>{const[id,i]=k.split("|"); const a=document.getElementById(id); if(a) a.children[+i].open=true;});  // 펼친 항목 유지
    if(add){const a=document.getElementById(card), sl=a&&a.querySelector(".seal");  // 쿵: 도장이 내려찍히고 카드가 살짝 흔들림
      if(sl){sl.classList.add("thud");  a.classList.add("thudcard"); setTimeout(()=>a.classList.remove("thudcard"),700); try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}}}
  });
  el.querySelectorAll(".spot").forEach(a=>a.addEventListener("click",e=>{
    if(e.target.closest("a,button,summary,li,details")) return;
    const m=markers[a.dataset.k]; showOnMap(m.getLatLng(),15); m.openPopup(); focusCard(...a.dataset.k.split("|"),false);
  }));
  el.querySelectorAll(".audioBtn").forEach(b=>b.onclick=e=>{e.stopPropagation(); play(b.dataset.a,b.dataset.t);});
  el.querySelectorAll(".near li").forEach(li=>li.onclick=()=>{  // 주변 볼거리: 지도에 표시하고 해설 링크 제공
    const ll=[+li.dataset.lat,+li.dataset.lng];
    nearLayer.clearLayers();
    L.circleMarker(ll,{radius:8,color:"#fff",weight:2,fillColor:"#6b5b95",fillOpacity:1}).addTo(nearLayer)
      .bindPopup(`<b>${esc(li.dataset.name)}</b><br><a href="${url(li.dataset.url)}" target="_blank" rel="noopener">국가유산 해설사에서 보기</a>`).openPopup();
    map.setView(ll,16);
  });
  el.querySelectorAll(".rest:not(.near) li").forEach(li=>li.onclick=()=>{
    const ll=[+li.dataset.lat,+li.dataset.lng];
    foodLayer.eachLayer(l=>{const p=l.getLatLng(); if(p.lat===ll[0]&&p.lng===ll[1]){map.setView(ll,17);l.openPopup();}});
  });
}
// 음성 해설: 패널 아래 한 개의 플레이어로 재생
const audio=document.getElementById("audio"), player=document.getElementById("player");
function play(src,title){player.hidden=false; document.getElementById("playerTitle").textContent=title; audio.src=src; audio.play().catch(()=>{});}
document.getElementById("playerClose").onclick=()=>{audio.pause(); player.hidden=true;};
function refreshPins(){  // 지도 확대 상태는 그대로 두고 핀 체크 표시만 갱신
  for(const k in markers){const[ck,num]=k.split("|"),c=C.find(x=>x.key===ck); markers[k].setIcon(pinIcon(num,COLOR[ck],c.group));}
}
function focusCard(key,num,raise=true){  // raise: 지도 핀을 눌렀을 때 작은 시트를 반으로 올림
  if(cur!==key) return;
  document.querySelectorAll(".spot.active").forEach(x=>x.classList.remove("active"));
  const c=document.getElementById(`card-${key}-${num}`); if(!c) return;
  c.classList.add("active");
  if(raise&&mobile()&&sheet==="peek") setSheet("half");
  setTimeout(()=>c.scrollIntoView({block:mobile()&&sheet==="peek"?"start":"nearest",behavior:"smooth"}),mobile()?300:0);
}
function select(k,noFit){  // noFit: 코스만 바꾸고 지도 화면은 그대로 (내 위치 찾기에서)
  cur=k;
  if(k){const c=C.find(x=>x.key===k); if(filter!=="all"&&String(c.group)!==filter) filter="all";}
  try{localStorage.setItem("hcm-course",k)}catch(e){}
  chips(); draw(noFit); list();
}
document.querySelectorAll(".filters .btn").forEach(b=>b.onclick=()=>{filter=b.dataset.f; select("");});
document.getElementById("foodBtn").onclick=e=>{showFood=!showFood;e.currentTarget.classList.toggle("on",showFood);e.currentTarget.setAttribute("aria-pressed",showFood);draw();};

let watchId=null, listedAt=null;
document.getElementById("gpsBtn").onclick=()=>{
  const msg=document.getElementById("gpsMsg");
  if(!navigator.geolocation){msg.textContent="이 브라우저는 위치 기능을 지원하지 않아요.";return;}
  msg.textContent="위치 확인 중…";
  if(watchId!=null) navigator.geolocation.clearWatch(watchId);
  let first=true;
  watchId=navigator.geolocation.watchPosition(p=>{
    me={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};
    meLayer.clearLayers();
    const blue=getComputedStyle(document.documentElement).getPropertyValue("--me").trim();
    L.circle([me.lat,me.lng],{radius:me.acc,color:blue,weight:1,fillOpacity:.1}).addTo(meLayer);
    L.circleMarker([me.lat,me.lng],{radius:7,color:"#fff",weight:2,fillColor:blue,fillOpacity:1}).bindPopup("내 위치").addTo(meLayer);
    if(first){first=false; listedAt=me;
      findNearest(me,`정확도 ±${Math.round(me.acc)}m ·`).then(r=>{if(!r) return; if(cur!==r.s.c.key) select(r.s.c.key,true); else list(); fitNear(me,r.h);});}  // 가장 가까운 유산의 코스를 고르고, 화면은 내 위치 주변
    else if(hav(listedAt.lat,listedAt.lng,me.lat,me.lng)>50){listedAt=me; list(); findNearest(me,`정확도 ±${Math.round(me.acc)}m ·`);}  // 50m 이상 움직였을 때만 다시 계산
  },err=>{  // 위치를 못 받으면 지도 가운데를 기준으로 찾아 준다
    const why=err.code===1?"위치 권한이 거부됐어요(주소창의 사이트 권한에서 허용).":"위치를 가져오지 못했어요.";
    findNearest(map.getCenter(),why+" 대신 지도 가운데에서");},
  {enableHighAccuracy:true,maximumAge:10000,timeout:15000});
};

// 모바일 시트: 작게(제목·버튼) / 반 / 크게. 손잡이·제목을 끌거나 누르면 바뀐다
const MQ=matchMedia("(max-width:820px)"), mobile=()=>MQ.matches, aside=document.querySelector("aside"), grab=document.getElementById("grab");
let sheet="half";
function sheetH(s){
  const vh=innerHeight;
  if(s==="peek") return Math.min(Math.round(vh*.45), document.getElementById("chips").offsetTop+2);
  return s==="full"?vh-48:Math.round(vh*.5);
}
function setSheet(s,keepScroll){
  if(!mobile()){aside.style.height=""; document.documentElement.style.removeProperty("--sheet-vis"); return;}
  sheet=s; const h=sheetH(s); aside.style.height=h+"px";
  document.documentElement.style.setProperty("--sheet-vis",Math.min(h,innerHeight*.6)+"px");
  L.Popup.prototype.options.autoPanPaddingBottomRight=L.point(10,Math.min(h,innerHeight*.6)+10);  // 팝업이 시트 밑에 숨지 않게
  grab.setAttribute("aria-expanded",s!=="peek");
  if(s==="peek"&&!keepScroll) aside.scrollTop=0;
}
const padB=(x=0)=>mobile()?Math.min(sheetH(sheet),innerHeight*.6)+30+x:30+x;  // 지도 맞춤 여백(아래)
function showOnMap(ll,z){  // 지도로 보여 줄 때: 모바일은 시트를 낮추고 시트 위 보이는 부분 가운데로
  if(mobile()&&sheet!=="peek") setSheet("peek");
  map.setView(ll,z,{animate:false});
  if(mobile()) map.panBy([0,Math.round(sheetH("peek")/2)],{animate:false});
}
let drag=null;
[grab,document.querySelector(".head h1")].forEach(el=>{
  el.addEventListener("pointerdown",e=>{if(!mobile()) return; drag={y:e.clientY,h:aside.offsetHeight,moved:false}; aside.classList.add("dragging"); el.setPointerCapture(e.pointerId);});
  el.addEventListener("pointermove",e=>{if(!drag) return; const dy=drag.y-e.clientY; if(Math.abs(dy)>5) drag.moved=true;
    aside.style.height=Math.max(sheetH("peek"),Math.min(innerHeight-48,drag.h+dy))+"px";});
  const up=()=>{if(!drag) return; aside.classList.remove("dragging"); const h=aside.offsetHeight, moved=drag.moved; drag=null;
    if(!moved){setSheet(sheet==="peek"?"half":sheet==="half"?"full":"peek"); return;}  // 누르면 작게→반→크게 차례로
    setSheet(["peek","half","full"].sort((a,b)=>Math.abs(sheetH(a)-h)-Math.abs(sheetH(b)-h))[0],true);};
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
});
addEventListener("resize",()=>setSheet(sheet,true));
MQ.addEventListener("change",()=>setSheet(sheet,true));
setSheet("half");

let saved=""; try{saved=localStorage.getItem("hcm-course")||""}catch(e){}
const fromHash=location.hash.replace("#c","");
select([fromHash,saved].find(k=>C.some(c=>c.key===k))||"");
drawKHS();
</script>
